<svg viewBox="0 0 670 720" xmlns="http://www.w3.org/2000/svg" width="670" height="720" data-page-h="720" data-tear-min="160" data-tear-max="194" data-column-y0="206">
<!-- The left top sheet: its upper part torn away (tear between y=160 and y=194), a lighter fringe of exposed paper core along the tear with a faint line of thickness inside it; fibre, mottling, foxing, toned edges (kept quiet under the text column). Text is painted at runtime. -->
<defs>
<filter id="tide" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="8" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="22" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation=".6"/>
    </filter>
<filter id="soft4" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="4"/>
</filter>
<filter id="pageMottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="4" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .42  0 0 0 0 .30  0 0 0 0 .17  -1.6 0 0 0 1.05"/>
    </filter>
<filter id="pageTex" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="44" result="tF"/>
      <feDiffuseLighting in="tF" surfaceScale="1.5" diffuseConstant="1.05" lighting-color="#fff">
        <feDistantLight azimuth="240" elevation="60"/>
      </feDiffuseLighting>
    </filter>
<filter id="soft10" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="10"/>
</filter>
</defs>
