<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 5 104 220" width="104" height="220" data-soles="219" data-feet-x0="46" data-feet-x1="124" data-ember-x="97.9" data-ember-y="48.6">
<!-- Harrier "Harry" Du Bois, profile puppet facing right (docs/design.md §6.4): big and heavy,
     pot belly, shoulders rounded; shaggy collar-length hair and big sideburns, a puffy face
     with a red nose; open green suede blazer over a creased white satin shirt; the Horrific
     Necktie, wide and askew; golden-brown flares; pale snakeskin shoes; a cigarette.
     data-soles: the SVG y on the fold line; data-feet-x0/x1: the x range the stand tab covers;
     data-ember-x/y: the cigarette's tip (the scene puts a glow there). -->
<defs>
<filter id="cutS" x="-15%" y="-15%" width="135%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="tE"/>
  <feDisplacementMap in="SourceGraphic" in2="tE" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="tF"/>
  <feDiffuseLighting in="tF" surfaceScale="0.78" diffuseConstant="1" lighting-color="#fff" result="fib">
    <feDistantLight azimuth="235" elevation="58"/>
  </feDiffuseLighting>
  <feComposite in="fib" in2="shape" operator="arithmetic" k1="0.55" k2="0" k3="0.5" k4="0" result="tex"/>
  <feGaussianBlur in="shape" stdDeviation="2.4" result="sb"/>
  <feComposite in="shape" in2="sb" operator="out" result="rimM"/>
  <feFlood flood-color="#050508" flood-opacity="0.38"/>
  <feComposite in2="rimM" operator="in" result="burn"/>
  <feOffset in="shape" dx="0.4" dy="1.1" result="sOff"/>
  <feComposite in="shape" in2="sOff" operator="out" result="edgeM"/>
  <feFlood flood-color="#f1e5c8" flood-opacity="0.38"/>
  <feComposite in2="edgeM" operator="in" result="edge"/>
  <feGaussianBlur in="shape" stdDeviation="1.3" result="shB"/>
  <feOffset in="shB" dx="1" dy="1.8" result="shO"/>
  <feFlood flood-color="#060403" flood-opacity="0.55"/>
  <feComposite in2="shO" operator="in" result="drop"/>
  <feMerge><feMergeNode in="drop"/><feMergeNode in="tex"/><feMergeNode in="burn"/><feMergeNode in="edge"/></feMerge>
</filter>
<!-- green suede: mottled, lighter where it catches the light -->
<linearGradient id="suede" x1="0" y1="0" x2="1" y2=".35">
  <stop offset="0" stop-color="#4a6a3a"/><stop offset=".55" stop-color="#5f8149"/><stop offset="1" stop-color="#6f9154"/>
</linearGradient>
<linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#58794a"/><stop offset="1" stop-color="#3f5c33"/>
</linearGradient>
<linearGradient id="flare" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#b17a33"/><stop offset=".6" stop-color="#c38c42"/><stop offset="1" stop-color="#a06a2a"/>
</linearGradient>
<linearGradient id="satin" x1="0" y1="0" x2="1" y2=".4">
  <stop offset="0" stop-color="#d9d4c6"/><stop offset=".6" stop-color="#f1ede2"/><stop offset="1" stop-color="#dcd6c7"/>
</linearGradient>
<!-- the Horrific Necktie: mustard, rust and teal, loud -->
<pattern id="tie" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(-32)">
  <rect width="7.5" height="7.5" fill="#d6a42e"/>
  <rect width="7.5" height="2.4" fill="#ad4127"/>
  <rect y="3.7" width="7.5" height="1.5" fill="#2f7b72"/>
  <circle cx="3.7" cy="6.3" r=".8" fill="#ad4127"/>
</pattern>
<pattern id="snake" patternUnits="userSpaceOnUse" width="3" height="2.2">
  <rect width="3" height="2.2" fill="#d9d0b4"/>
  <path d="M0,1.1 L1.5,0 L3,1.1 L1.5,2.2 Z" fill="none" stroke="#9d9279" stroke-width=".45"/>
</pattern>
</defs>

<!-- the legs, drawn to y 211 and stretched to 219 below the hips: he is tall -->
<g transform="translate(0 125) scale(1 1.093) translate(0 -125)">
<!-- back leg: the far trouser leg, in shade, flaring wide at the ankle -->
<g filter="url(#cutS)">
  <path fill="#9a6526" d="M49,124 C50,140 52,154 55,166 C53,180 47,194 42,205 L79,205 C76,192 72,180 71,168 C72,156 74,144 77,128 Z"/>
</g>
<g filter="url(#cutS)">
  <path fill="url(#snake)" d="M52,204 H81 C87,204 92,206 93,209.5 L93,211 H50 Z"/>
  <path fill="#6d6250" d="M50,209.6 H93 V211 H50 Z"/>
</g>

<!-- front leg: golden-brown flares, stepping forward -->
<g filter="url(#cutS)">
  <path fill="url(#flare)" d="M67,121 L101,121 C102,139 101,154 100,167 C104,182 111,195 117,205 L76,205 C79,193 82,180 84,167 C80,152 72,138 67,121 Z"/>
</g>
<path d="M92,128 C92.5,146 92,160 95,176 C97,188 100,197 104,204" stroke="#7e5220" stroke-width="1" fill="none" opacity=".75"/>
<path d="M84,170 C82,182 80,194 78.5,204" stroke="#e0b06a" stroke-width=".8" fill="none" opacity=".5"/>
<g filter="url(#cutS)">
  <path fill="url(#snake)" d="M88,204 H113 C120,204 125,206 126,209.5 L126,211 H86 Z"/>
  <path fill="#6d6250" d="M86,209.6 H126 V211 H86 Z"/>
</g>
</g>

<!-- the shirt: creased white satin over the belly, tucked under it -->
<g filter="url(#cutS)">
  <path fill="url(#satin)" d="M72,54 L87,55 C96,62 107,74 113,86 C118,97 119,108 114.5,117 C110,124 102,128 93,128 L70,128 Z"/>
</g>
<g fill="none" stroke-linecap="round">
  <path d="M97,77 C101,82 104,87 105,93 M100,108 C104,110 107,113 108,117 M94,114 C98,118 101,121 103,124" stroke="#a9a293" stroke-width=".9" opacity=".8"/>
  <path d="M97,79 C102,84 105,90 106,96" stroke="#fffdf6" stroke-width=".7" opacity=".7"/>
</g>
<!-- belt, half lost under the belly -->
<path fill="#3a2a1d" d="M88,121 L105,119.5 L104,124.5 L88,126.5 Z"/>

<!-- the Horrific Necktie: wide, 70s, swung off to one side over the belly -->
<g filter="url(#cutS)">
  <path fill="url(#tie)" d="M85.5,58.5 L91.5,57.5 C100,65 108.5,76 114.5,88 L119.5,98.5 C121,106 121.5,115 121,123 L116,131 L110,123.5 C110,115 110,107 109,100.5 C104,89 96.5,78 89.5,67.5 C88,65 86.5,63 85.5,62 Z"/>
  <path fill="#a6452a" d="M83,54.5 L92,53.5 L93.5,58.5 L84,60 Z"/>
</g>
<path d="M86,61 C93,70 101,81 107,94" stroke="#fff3cf" stroke-width=".7" fill="none" opacity=".45"/>

<!-- the blazer: green suede, open, the back rounded -->
<g filter="url(#cutS)">
  <path fill="url(#suede)" d="M61,53 C49,57 39,67 37.5,81 C36.5,97 39,114 42,133 L70,135 L96,131 C95,113 93,93 90,73 L84,57 Z"/>
</g>
<!-- lapel and collar -->
<g filter="url(#cutS)">
  <path fill="#7a9960" d="M81,55 L89,58 L94,71 L91,79 L86,66 Z"/>
  <path fill="#48683a" d="M60,53 L72,50 L74,57 L62,59 Z"/>
</g>
<!-- blazer seams, pocket flap, a scuffed nap -->
<g fill="none" stroke-linecap="round">
  <path d="M44,90 C47,104 49,118 51,132" stroke="#34502a" stroke-width="1" opacity=".7"/>
  <path d="M74,112 L89,110.5" stroke="#34502a" stroke-width="1.3" opacity=".8"/>
  <path d="M40,72 C44,66 50,61 57,58" stroke="#8fb071" stroke-width=".8" opacity=".6"/>
</g>

<!-- the near arm: hanging, heavy, the hand at the hip -->
<g filter="url(#cutS)">
  <path fill="url(#sleeve)" d="M55,60 C65,57 72,63 72.5,72 C73,84 69,95 65,101 C69,109 75,115 79,120 L71,127 C62,119 55,111 50.5,103 C48,88 49.5,70 55,60 Z"/>
</g>
<path d="M53,70 C52,82 53,94 56,103" stroke="#7fa060" stroke-width=".8" fill="none" opacity=".55"/>
<g filter="url(#cutS)">
  <path fill="#ece7dc" d="M71,121 L79,116.5 L82,121 L74,126.5 Z"/>
  <path fill="#c9977a" d="M74,126 C77,122 81,120 84,121.5 C86,124 85,129 82,132 C79,133 75,131 74,126 Z"/>
</g>

<!-- the head: puffy, a red nose, heavy-lidded; hair to the collar and big sideburns -->
<g transform="translate(74 54) scale(.9) translate(-74 -54)">
  <!-- neck and shirt collar -->
  <path fill="#c4916f" d="M65,46 L82,46 L85,56 L66,58 Z"/>
  <g filter="url(#cutS)">
    <path fill="#efeade" d="M75,51 L87,53.5 L85,60.5 L78,57 Z"/>
  </g>
  <g filter="url(#cutS)">
    <path fill="#cf9e7c" d="M60,20 C66,16 78,16 84,20 C87,23 88,26 88,28 L88.5,30 C90,32 92.5,34.5 94.5,37 C96.5,38.5 96.8,40.5 95,41.5 C93,42 91,41.8 90,41.2 C90.6,42.2 91,43.2 90.5,44.2 L89.6,45.2 C90.6,46.2 90.6,47.2 89.6,48.2 C89.2,50.2 88.6,52 86,53.2 C84,55 80,56 76,55.3 C72,55.2 68,54 64,52 C60,48 58,40 58,32 C58,26 58.4,22 60,20 Z"/>
  </g>
  <!-- nose, flushed; cheek; eye with its bag; brow -->
  <circle cx="93.4" cy="39.4" r="2.6" fill="#c25a50" opacity=".75"/>
  <ellipse cx="83" cy="41" rx="4.5" ry="3" fill="#c7806a" opacity=".45"/>
  <path d="M82.5,31 L86,30.6" stroke="#2a1a14" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M81.5,33.6 C83,35.2 85.5,35.4 87.2,34" stroke="#8a5646" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <path d="M80.5,28 C82.5,26.4 85.5,26.2 88,27" stroke="#3b2618" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M86.5,50.5 C84.5,52.5 81,53.5 77.5,53.4" stroke="#9f6d55" stroke-width=".8" fill="none" opacity=".8"/>
  <!-- the ear, between the hair and the sideburn -->
  <path fill="#bb8566" d="M61.5,32.5 C65,31 68.5,33 68.5,37 C68.5,40.5 66,42.5 62.5,41.5 Z"/>
  <path d="M63.2,34.5 C65.5,35 66.3,37 65.3,39.3" stroke="#8a5646" stroke-width=".7" fill="none"/>
  <!-- hair: shaggy, down to the collar at the back -->
  <g filter="url(#cutS)">
    <path fill="#3b2618" d="M52,34 C50,22 58,11 71,9 C81,8 88,12 90,19 C87,18.5 85,19.5 84,21.5 C80,19.5 74,19.5 69.5,22 C66,24.5 63.5,28 62.5,32 C62,37 62,42 61.5,46 C61,51 60.5,55 59.5,59.5 L57.5,55.5 L55,60.5 L52,55 L48.5,58 L48,50 C47,44 50,40 52,34 Z"/>
  </g>
  <!-- the big sideburn, a bushy band from the temple to the jaw -->
  <g filter="url(#cutS)">
    <path fill="#2f1d12" d="M68,22.5 C71,28 72.5,33 75,38.5 C77,42.5 78.2,46.5 76.6,50 C75,52.3 71.6,52.4 70,50.2 C68.8,45.5 68,40.5 67.4,35.5 C67,30.5 67.3,26 68,22.5 Z"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M58,16 C62,14 67,13 72,13 M55,26 C57,21 61,18 66,17 M53,40 C52,46 52,50 54,55 M58,40 C58,46 59,50 61,55" stroke="#6b4a31" stroke-width=".9" opacity=".8"/>
    <path d="M70,27 C71.5,33 73,39 75,45 M72,49 L73.5,51.5 M75,47.5 L77.4,49.8" stroke="#5a3b24" stroke-width=".8" opacity=".8"/>
  </g>
  <!-- cigarette -->
  <path fill="#ece6d8" d="M89.4,45.4 L100.6,47.3 L100.4,48.7 L89.2,46.9 Z"/>
  <path fill="#8b8378" d="M99.4,47.1 L100.6,47.3 L100.4,48.7 L99.2,48.5 Z"/>
</g>
</svg>
