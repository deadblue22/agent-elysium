<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 244 232" width="244" height="232" data-soles="200" data-path-x0="-40" data-path-x1="186" data-path-y1="47" data-foot-x="16" data-landing-x="222">
<!-- The stairwell, raised from the floor for the reconstruction (stage cue raise-stairs): a
     flight of nine steps (run 20, rise 17) climbing to the right onto a landing, the stringer
     cut open underneath, a handrail on turned balusters. data-soles: the floor line; the
     climb follows the nosings from data-foot-x (at the floor) to (data-path-x1, data-path-y1),
     then along the landing to data-landing-x. -->
<defs>
<filter id="cutS" x="-15%" y="-15%" width="135%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="tE"/>
  <feDisplacementMap in="SourceGraphic" in2="tE" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="tF"/>
  <feDiffuseLighting in="tF" surfaceScale="0.78" diffuseConstant="1" lighting-color="#fff" result="fib">
    <feDistantLight azimuth="235" elevation="58"/>
  </feDiffuseLighting>
  <feComposite in="fib" in2="shape" operator="arithmetic" k1="0.55" k2="0" k3="0.5" k4="0" result="tex"/>
  <feGaussianBlur in="shape" stdDeviation="2.4" result="sb"/>
  <feComposite in="shape" in2="sb" operator="out" result="rimM"/>
  <feFlood flood-color="#050508" flood-opacity="0.38"/>
  <feComposite in2="rimM" operator="in" result="burn"/>
  <feOffset in="shape" dx="0.4" dy="1.1" result="sOff"/>
  <feComposite in="shape" in2="sOff" operator="out" result="edgeM"/>
  <feFlood flood-color="#f1e5c8" flood-opacity="0.38"/>
  <feComposite in2="edgeM" operator="in" result="edge"/>
  <feGaussianBlur in="shape" stdDeviation="1.3" result="shB"/>
  <feOffset in="shB" dx="1" dy="1.8" result="shO"/>
  <feFlood flood-color="#060403" flood-opacity="0.55"/>
  <feComposite in2="shO" operator="in" result="drop"/>
  <feMerge><feMergeNode in="drop"/><feMergeNode in="tex"/><feMergeNode in="burn"/><feMergeNode in="edge"/></feMerge>
</filter>
<linearGradient id="stringer" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#3a291e"/><stop offset="1" stop-color="#4c3727"/>
</linearGradient>
</defs>
<g filter="url(#cutS)">
  <path fill="url(#stringer)" d="M16,200 V183 H36 V166 H56 V149 H76 V132 H96 V115 H116 V98 H136 V81 H156 V64 H176 V47 H240 V200 H226 V62 L201,62 L44,200 Z"/>
</g>
<path d="M16,183 h20 M36,166 h20 M56,149 h20 M76,132 h20 M96,115 h20 M116,98 h20 M136,81 h20 M156,64 h20 M176,47 h20 M196,47 H240" stroke="#8a6a4a" stroke-width="2.2" opacity=".85"/>
<path d="M44,200 L201,62 M226,62 V200" stroke="#241910" stroke-width="1.4" opacity=".7" fill="none"/>
<g filter="url(#cutS)">
  <path fill="#2a1d14" d="M17,200 V132 h8 V200 Z M196,47 V-28 h7 V47 Z M234,47 V-28 h6 V47 Z"/>
  <circle cx="21" cy="129" r="5.5" fill="#3a2a1d"/>
  <circle cx="199.5" cy="-30" r="5" fill="#3a2a1d"/>
</g>
<path d="M21,132 L199.5,-19.7 M199.5,-24 H237" stroke="#2c1f15" stroke-width="3.6" stroke-linecap="round" fill="none"/>
<path d="M21,130.4 L199.5,-21.3 M199.5,-25.6 H237" stroke="#8a6a4a" stroke-width=".9" opacity=".6" fill="none"/>
<path d="M26.0,183 V127.8 M46.0,166 V110.8 M66.0,149 V93.8 M86.0,132 V76.8 M106.0,115 V59.8 M126.0,98 V42.8 M146.0,81 V25.8 M166.0,64 V8.8 M186.0,47 V-8.2 M210,47 V-24 M222,47 V-24" stroke="#2f2118" stroke-width="1.8" fill="none"/>
</svg>
