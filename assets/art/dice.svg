<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" width="240" height="40" data-bake-scale="3">
  <!-- Paper dice: faces 1..6 left to right, 40x40 each. Shading comes from the scene's lights. -->
  <defs>
