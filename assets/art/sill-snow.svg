            <clipPath id="wallClip">
<path id="wallShapeClip" clip-rule="evenodd" d="M0,440 V38 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 a33.500,16 0 0 1 67.000,0 V440 Z M378,92 H592 V318 H378 Z"/>
</clipPath>
            <radialGradient id="winSpill" cx="486" cy="230" r="260" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#b9cbd6" stop-opacity=".5"/>
<stop offset=".4" stop-color="#8ea4b4" stop-opacity=".14"/>
<stop offset="1" stop-color="#8ea4b4" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="candleSpill" cx="770" cy="300" r="440" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#f3ad62" stop-opacity=".5"/>
<stop offset=".35" stop-color="#d98c49" stop-opacity=".2"/>
<stop offset="1" stop-color="#d98c49" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="wallV" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#030409" stop-opacity=".78"/>
<stop offset=".3" stop-color="#030409" stop-opacity=".22"/>
              <stop offset=".8" stop-color="#030409" stop-opacity=".1"/>
<stop offset="1" stop-color="#030409" stop-opacity=".5"/>
            </linearGradient>
            <linearGradient id="wallH" x1="0" x2="1">
              <stop offset="0" stop-color="#030409" stop-opacity=".7"/>
<stop offset=".2" stop-color="#030409" stop-opacity="0"/>
              <stop offset=".8" stop-color="#030409" stop-opacity="0"/>
<stop offset="1" stop-color="#030409" stop-opacity=".75"/>
            </linearGradient>
            <linearGradient id="casing" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#9b9a90"/>
<stop offset=".6" stop-color="#7c7c74"/>
<stop offset="1" stop-color="#5a5b56"/>
            </linearGradient>
          </defs>
          
