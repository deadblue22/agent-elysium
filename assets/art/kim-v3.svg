<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 10 72 193" width="72" height="193" data-soles="201" data-feet-x0="32" data-feet-x1="72">
<!-- Kim, version 3 (docs/cast.md): after the game's cover (The Final Cut; the same painting on the
     original release's poster). Black hair slicked back from a side parting over shaved sides;
     round glasses in a heavy black rim; a thin moustache; a cold blue light on the forehead. A
     burnt-orange bomber worn open over a white T-shirt, a dark knit collar and black ribbed cuffs,
     the sleeves pushed up off pale forearms; tan leather driving gloves; dark grey-green
     trousers. The near hand hangs in a fist as on the cover; the far hand, which holds a pistol
     there, holds his notebook here. Faces left.
     data-soles: the SVG y on the fold line; data-feet-x0/x1: the x range the stand tab covers. -->
<defs>
<filter id="cutS" x="-15%" y="-15%" width="135%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="tE"/>
  <feDisplacementMap in="SourceGraphic" in2="tE" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="tF"/>
  <feDiffuseLighting in="tF" surfaceScale="0.78" diffuseConstant="1" lighting-color="#fff" result="fib">
    <feDistantLight azimuth="235" elevation="58"/>
  </feDiffuseLighting>
  <feComposite in="fib" in2="shape" operator="arithmetic" k1="0.55" k2="0" k3="0.5" k4="0" result="tex"/>
  <feGaussianBlur in="shape" stdDeviation="2.4" result="sb"/>
  <feComposite in="shape" in2="sb" operator="out" result="rimM"/>
  <feFlood flood-color="#050508" flood-opacity="0.38"/>
  <feComposite in2="rimM" operator="in" result="burn"/>
  <feOffset in="shape" dx="0.4" dy="1.1" result="sOff"/>
  <feComposite in="shape" in2="sOff" operator="out" result="edgeM"/>
  <feFlood flood-color="#f1e5c8" flood-opacity="0.38"/>
  <feComposite in2="edgeM" operator="in" result="edge"/>
  <feGaussianBlur in="shape" stdDeviation="1.3" result="shB"/>
  <feOffset in="shB" dx="1" dy="1.8" result="shO"/>
  <feFlood flood-color="#060403" flood-opacity="0.55"/>
  <feComposite in2="shO" operator="in" result="drop"/>
  <feMerge><feMergeNode in="drop"/><feMergeNode in="tex"/><feMergeNode in="burn"/><feMergeNode in="edge"/></feMerge>
</filter>
<!-- burnt orange, browner in the shade than the other versions -->
<linearGradient id="burnt" x1="1" y1="0" x2="0" y2=".4">
  <stop offset="0" stop-color="#8a3c1e"/><stop offset=".5" stop-color="#a84c24"/><stop offset="1" stop-color="#c2622e"/>
</linearGradient>
<linearGradient id="burntSleeve" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#c0602c"/><stop offset="1" stop-color="#8e4020"/>
</linearGradient>
<pattern id="ribDark" patternUnits="userSpaceOnUse" width="2.2" height="4">
  <rect width="2.2" height="4" fill="#2c221d"/>
  <rect width=".7" height="4" fill="#17110e"/>
</pattern>
<pattern id="ribHem" patternUnits="userSpaceOnUse" width="2.4" height="4">
  <rect width="2.4" height="4" fill="#7a3519"/>
  <rect width=".8" height="4" fill="#5c2712"/>
</pattern>
<linearGradient id="trousers" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#474b3d"/><stop offset="1" stop-color="#383b30"/>
</linearGradient>
</defs>

<!-- far leg and boot -->
<g filter="url(#cutS)">
  <path fill="#2f3229" d="M57,124 L71,124 C71.5,146 71,168 70,190 L57.5,190 C57.5,169 57,146 57,124 Z"/>
</g>
<g filter="url(#cutS)">
  <path fill="#1f1915" d="M56,188 L71,188 L71.5,201 L48.5,201 C48.5,196 51.5,189.5 56,188 Z"/>
</g>
<!-- near leg and boot -->
<g filter="url(#cutS)">
  <path fill="url(#trousers)" d="M45,122 L62.5,122 C62.5,146 62,169 61.5,190 L46.5,190 C46,169 45,146 45,122 Z"/>
</g>
<path d="M53,127 C53.5,149 54,170 54.5,189" stroke="#262821" stroke-width=".9" fill="none" opacity=".75"/>
<g filter="url(#cutS)">
  <path fill="#2a211b" d="M46,188 L62.5,188 L63,201 L33,201 C33,195.5 37,190 46,188 Z"/>
  <path fill="#130e0b" d="M33,199.4 H63 V201 H33 Z"/>
</g>
<path d="M37,195 C41,193 45,192 49,192" stroke="#5d4a3e" stroke-width=".8" fill="none" opacity=".6"/>

<!-- the white T-shirt at the open front -->
<g filter="url(#cutS)">
  <path fill="#eceee8" d="M42.5,58 L50,57 L50,112 L44,112 C42.5,95 42,76 42.5,58 Z"/>
</g>
<path d="M44.5,70 C44.2,82 44.4,95 45.4,108" stroke="#b9c0c0" stroke-width=".8" fill="none" opacity=".8"/>
<!-- the bomber, open, blousing over its hem -->
<g filter="url(#cutS)">
  <path fill="url(#burnt)" d="M50,53 L67,53 C72.5,57 75,65 75.2,76 C75.4,89 76,101 75.4,111 L73.8,114 L49.6,114 C48.6,104 48.2,93 48.4,82 C48.6,71 48.6,61 50,53 Z"/>
</g>
<g filter="url(#cutS)">
  <path fill="url(#ribHem)" d="M49.2,110.5 L75.6,110.5 L74.6,123 L50,123 Z"/>
</g>
<g fill="none" stroke-linecap="round">
  <path d="M51.2,62 C50.6,78 50.6,94 51.4,108" stroke="#d27438" stroke-width=".9" opacity=".6"/>
  <path d="M72.5,70 C73.6,82 74,94 73.6,106" stroke="#6a2c14" stroke-width=".9" opacity=".6"/>
</g>

<!-- the far arm: raised, the notebook held open in front of the chest -->
<g filter="url(#cutS)">
  <path fill="#8e4020" d="M50.5,63 L54,74 L46,78.5 L41.5,70.5 Z"/>
  <path fill="url(#ribDark)" d="M41.8,70 L46.4,78 L42.4,80.4 L37.8,72.6 Z"/>
  <path fill="#d4b89c" d="M37.9,72.7 L42.3,80.2 L39.2,82 L34.8,74.6 Z"/>
  <path fill="#b8622e" d="M28.4,72.4 C31,70.4 34.4,71 35.6,73.6 L38.4,79.6 C36.4,82 32.6,82.4 30.2,80.6 Z"/>
</g>
<g filter="url(#cutS)">
  <path fill="#3a2a22" d="M18,68 L32.5,65 L35,86 L20.5,89 Z"/>
  <path fill="#efe8d8" d="M19.3,69 L31.6,66.4 L33.8,85 L21.6,87.6 Z"/>
</g>
<path d="M21.4,73.2 L31,71.2 M21.9,77 L31.5,75 M22.4,80.8 L29.8,79.2" stroke="#6f6a5d" stroke-width=".7" opacity=".8"/>
<path fill="#c96c33" d="M29,73 C31,72.4 32.4,73.6 32.2,75.4 L31.8,78.4 C30.6,79.2 29.2,78.8 28.6,77.6 Z"/>

<!-- the near arm: hanging, the sleeve pushed up off the forearm, a gloved fist at the hip -->
<g filter="url(#cutS)">
  <path fill="url(#burntSleeve)" d="M55,58.5 C61,54.5 69.5,56 72.5,62.5 C74.5,67 74.5,74 73.5,81 C72.5,88 71.5,93.5 71.2,98 L60.8,99.2 C59.8,93 58.5,86 57,79 C55.8,73 54.6,67 54.3,62.5 C54.3,61 54.5,59.6 55,58.5 Z"/>
</g>
<g fill="none" stroke-linecap="round">
  <path d="M58,62.5 C61.5,59.2 67,59 70.4,62" stroke="#dd8248" stroke-width=".8" opacity=".55"/>
  <path d="M60,76 C61.5,83 62.8,90 63.8,96" stroke="#6a2c14" stroke-width=".8" opacity=".55"/>
</g>
<g filter="url(#cutS)">
  <path fill="url(#ribDark)" d="M60.6,97.6 L71.4,96.4 L71.8,103.6 L61.2,104.8 Z"/>
  <path fill="#d7bca0" d="M62.2,104.2 L70.4,103.2 L70,111.2 L62.8,112 Z"/>
  <path fill="#b8622e" d="M61.4,111.4 C64,109.8 68.4,109.6 71,111.2 C72.8,113.4 72.8,117.6 71,120.6 C68.6,122.4 64.4,122.2 62.2,120.2 C60.6,117.6 60.4,114 61.4,111.4 Z"/>
</g>
<path d="M62.6,113.6 L70.4,113.2 M63,116.4 C65.2,116 67.8,116 70,116.6" stroke="#7e3c1c" stroke-width=".7" fill="none" opacity=".8"/>

<!-- the head: black hair slicked back from a side parting; round glasses -->
<g transform="translate(57 52) scale(.88) translate(-57 -52)">
  <path fill="#c9a37e" d="M52,44 L63,43 L64.5,55 L52.5,56 Z"/>
  <!-- the dark knit collar, turned up round the neck -->
  <g filter="url(#cutS)">
    <path fill="url(#ribDark)" d="M47.5,48 L65.5,46 L69.5,58 L48.5,61 Z"/>
  </g>
  <g filter="url(#cutS)">
    <path fill="#d7b48c" d="M66,19 C60,15 50,15.5 45,19.5 C43,22.5 42.5,25.5 42.5,27.5 L42,30 C41,32 39.5,35 38.2,37.8 C37.8,38.8 38.3,39.8 39.6,40.2 C40.6,40.6 41.4,41.2 41.4,42.2 L41.8,43.8 C41.4,44.8 41.5,45.8 42,46.8 C42.5,48.8 43.2,50.6 45.2,51.6 C48.2,53 54,52.6 58,50.6 C62,48.6 66,43.6 67,37.6 C68,29.6 68,23.6 66,19 Z"/>
  </g>
  <path fill="#8faad0" d="M44.6,22.8 C47,21 50.8,20.4 54,21.4 C52.4,23.4 49.4,24.6 46,24.6 C45.4,24.1 45,23.5 44.6,22.8 Z" opacity=".85"/>
  <path fill="#b08462" d="M56.6,37 C59,39.4 60.2,42.8 60.4,46.4 C58.4,48.8 55.4,50.6 52,51.6 C49.8,52.2 47.6,52.2 45.6,51.8 C50,50.2 53.6,47.2 55.2,43 C56,41 56.4,39 56.6,37 Z" opacity=".6"/>
  <path d="M43.2,49.4 C45.4,51.2 48.8,51.6 51.8,50.8" stroke="#a88460" stroke-width=".7" fill="none" opacity=".7"/>
  <path d="M41.6,41.8 L46.2,41.4" stroke="#2a1d17" stroke-width=".95" stroke-linecap="round"/>
  <path d="M43.8,27.4 C45.4,26.4 47.4,26.3 49,26.8" stroke="#1a1512" stroke-width="1.25" fill="none" stroke-linecap="round"/>
  <!-- the ear -->
  <path fill="#c49c75" d="M58.5,30.5 C61.5,30 63.5,32.5 63,36 C62.5,39 60.5,40 58.5,39 Z"/>
  <path d="M59.6,32.9 C61,33.5 61.4,35.1 60.6,36.7" stroke="#8c6a4e" stroke-width=".7" fill="none"/>
  <!-- shaved sides, then the hair combed back and over from the parting -->
  <path fill="#6f5f54" d="M56.8,26 C61.6,23.8 67.6,24 70.6,28.4 C72,33.2 71.4,38.8 69,44 L65,44.2 C65.6,39 64.8,34.2 62.4,31.2 C60.6,30 58.6,28.4 56.8,26 Z" opacity=".85"/>
  <g filter="url(#cutS)">
    <path fill="#15171a" d="M43.8,24 C43,19.6 44.6,15.6 48.6,13.2 C53,10.8 59.4,10.4 64.4,11.8 C69.4,13.2 72.6,16.6 72.8,21.2 C73.2,25 72.6,28.6 71.2,31.4 L69.6,30 L68.6,31.8 L67,29 C64.2,27.6 61,27.2 58.4,27.8 C56.6,28.2 55.4,29.4 55,31.2 L54.6,34 L52.8,33.8 C52.6,30.4 51.2,27.4 48.8,25.4 C47.2,24.6 45.4,24.2 43.8,24 Z"/>
  </g>
  <path d="M46.6,19 C52,15.4 60,14.2 67.2,16.6 M52,15.6 C50.4,17.6 49.4,19.8 49,22.4 M50.6,22.4 C56.2,19.6 63.2,19.4 69.8,22.8" stroke="#555d66" stroke-width=".8" fill="none" opacity=".8" stroke-linecap="round"/>
  <!-- the glasses: a heavy round rim, the arm back to the ear -->
  <path d="M49.6,30.8 L59.6,31.6" stroke="#111" stroke-width="1.1"/>
  <circle cx="45.8" cy="31" r="3.6" fill="#dfe6e8" fill-opacity=".4" stroke="#111" stroke-width="1.4"/>
  <path d="M44.2,29.3 C45,28.6 46.2,28.6 47,29.1" stroke="#fff" stroke-width=".7" fill="none" opacity=".8"/>
  <path d="M42,31 L42.4,31" stroke="#111" stroke-width="1"/>
</g>
</svg>
