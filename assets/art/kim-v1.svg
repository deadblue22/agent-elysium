<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 6 72 197" width="72" height="197" data-soles="201" data-feet-x0="32" data-feet-x1="72">
<!-- Kim, version 1 (docs/cast.md): after his painted dialogue portrait. The head a little larger
     than life: black hair cropped short, standing up in spikes on top, the sides shaved; round
     glasses in a heavy black rim, a glint on the lens; a thin moustache; a big ear; olive skin
     warmed with orange in the shadows and a cold blue light on the forehead. A warm orange
     jacket with a tall stand collar, rust inside it, a silver zip up to the chin and a round
     white badge on the chest. Below the portrait's frame: gloved, a notebook and a pen, brown
     trousers and boots. Faces left.
     data-soles: the SVG y on the fold line; data-feet-x0/x1: the x range the stand tab covers. -->
<defs>
<filter id="cutS" x="-15%" y="-15%" width="135%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="tE"/>
  <feDisplacementMap in="SourceGraphic" in2="tE" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="tF"/>
  <feDiffuseLighting in="tF" surfaceScale="0.78" diffuseConstant="1" lighting-color="#fff" result="fib">
    <feDistantLight azimuth="235" elevation="58"/>
  </feDiffuseLighting>
  <feComposite in="fib" in2="shape" operator="arithmetic" k1="0.55" k2="0" k3="0.5" k4="0" result="tex"/>
  <feGaussianBlur in="shape" stdDeviation="2.4" result="sb"/>
  <feComposite in="shape" in2="sb" operator="out" result="rimM"/>
  <feFlood flood-color="#050508" flood-opacity="0.38"/>
  <feComposite in2="rimM" operator="in" result="burn"/>
  <feOffset in="shape" dx="0.4" dy="1.1" result="sOff"/>
  <feComposite in="shape" in2="sOff" operator="out" result="edgeM"/>
  <feFlood flood-color="#f1e5c8" flood-opacity="0.38"/>
  <feComposite in2="edgeM" operator="in" result="edge"/>
  <feGaussianBlur in="shape" stdDeviation="1.3" result="shB"/>
  <feOffset in="shB" dx="1" dy="1.8" result="shO"/>
  <feFlood flood-color="#060403" flood-opacity="0.55"/>
  <feComposite in2="shO" operator="in" result="drop"/>
  <feMerge><feMergeNode in="drop"/><feMergeNode in="tex"/><feMergeNode in="burn"/><feMergeNode in="edge"/></feMerge>
</filter>
<!-- the portrait's orange: warm, yellow in the light, rust in the folds -->
<linearGradient id="orange" x1="1" y1="0" x2="0" y2=".35">
  <stop offset="0" stop-color="#c26a1f"/><stop offset=".55" stop-color="#dc8a2c"/><stop offset="1" stop-color="#e89d3c"/>
</linearGradient>
<linearGradient id="orangeSleeve" x1="1" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#d27c26"/><stop offset="1" stop-color="#b0591b"/>
</linearGradient>
<pattern id="rib" patternUnits="userSpaceOnUse" width="2.4" height="4">
  <rect width="2.4" height="4" fill="#a55117"/>
  <rect width=".8" height="4" fill="#823e10"/>
</pattern>
<linearGradient id="trousers" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#5e4331"/><stop offset="1" stop-color="#4a3325"/>
</linearGradient>
</defs>

<!-- far leg, far boot -->
<g filter="url(#cutS)">
  <path fill="#433024" d="M57,126 L71,126 C71.5,148 71,170 70,191 L57.5,191 C57.5,170 57,148 57,126 Z"/>
</g>
<g filter="url(#cutS)">
  <path fill="#241a14" d="M56,189 L71,189 L71.5,201 L49,201 C49,196 51.5,190.5 56,189 Z"/>
</g>
<!-- near leg, near boot: toes pointing left -->
<g filter="url(#cutS)">
  <path fill="url(#trousers)" d="M45,126 L62,126 C62,150 61.5,171 61,191 L46.5,191 C46,170 45,148 45,126 Z"/>
</g>
<path d="M52,130 C52.5,152 53,172 53.5,190" stroke="#35251b" stroke-width=".9" fill="none" opacity=".75"/>
<g filter="url(#cutS)">
  <path fill="#2e2119" d="M46,189 L62,189 L62.5,201 L33,201 C33,196 37,191 46,189 Z"/>
  <path fill="#160f0b" d="M33,199.4 H62.5 V201 H33 Z"/>
</g>
<path d="M37,195 C41,193 45,192 49,192" stroke="#6a5344" stroke-width=".8" fill="none" opacity=".6"/>

<!-- the jacket: straight back, a little blousy over its ribbed hem -->
<g filter="url(#cutS)">
  <path fill="url(#orange)" d="M49,56 L67,56 C72,60 74.5,67 74.5,79 C74.5,92 75.5,104 75,116 L45,116 C43,104 41.5,92 41.5,80 C41.5,68 44,60 49,56 Z"/>
</g>
<g filter="url(#cutS)">
  <path fill="url(#rib)" d="M44.5,114 L75.5,114 L74.5,127.5 L45.5,127.5 Z"/>
</g>
<!-- the zip up the front, the badge on the chest -->
<path d="M43.2,60 C42.2,76 42.2,94 44.2,113" stroke="#8a4414" stroke-width="1.6" fill="none" opacity=".8"/>
<path d="M43.2,60 C42.2,76 42.2,94 44.2,113" stroke="#d9d6cc" stroke-width=".7" fill="none" stroke-dasharray="1 .8"/>
<g filter="url(#cutS)">
  <circle cx="50" cy="73" r="3.6" fill="#efe9dc"/>
</g>
<path d="M48.6,72.6 C48.8,71.2 50.8,70.8 51.4,72.2 C51.8,73.6 50.4,74.8 49.4,74.2 M50.6,74.6 C52,75.4 52.8,75 53,74" stroke="#5a4a40" stroke-width=".6" fill="none"/>
<g fill="none" stroke-linecap="round">
  <path d="M47,64 C46,78 46.5,92 48,106" stroke="#f4b25c" stroke-width=".9" opacity=".55"/>
  <path d="M69,66 C71,80 71.5,96 71,110" stroke="#a24f16" stroke-width=".9" opacity=".6"/>
</g>

<!-- the far hand: gloved, pen at work over the notebook -->
<g filter="url(#cutS)">
  <path fill="#b0591b" d="M44,62 L51,63.5 L49,74 L40,72 Z"/>
  <path fill="url(#rib)" d="M37.5,63.5 L42.5,64 L41.5,73 L36.5,72.5 Z"/>
  <path fill="#6f2c1d" d="M30,64.5 C33,62.5 36.5,63 38,66 L38,72 C35.5,74 31.5,73.5 29.5,71.5 Z"/>
</g>
<path d="M22.5,78.5 L32,67.5" stroke="#151515" stroke-width="1.5" stroke-linecap="round"/>
<path d="M22.2,78.8 L23.6,77.4" stroke="#c9a05a" stroke-width="1.4" stroke-linecap="round"/>

<!-- the notebook, held in the near hand -->
<g filter="url(#cutS)">
  <path fill="#3a2a22" d="M19,70 L34.5,72 L33.5,93 L18,91 Z"/>
  <path fill="#efe8d8" d="M20.2,71.4 L33.4,73.2 L32.5,91.8 L19.3,90 Z"/>
</g>
<path d="M21.5,76.5 L31.5,78 M21.3,80.5 L31.3,82 M21.1,84.5 L28.5,85.6" stroke="#6f6a5d" stroke-width=".7" opacity=".8"/>

<!-- the near arm: bent at the elbow, the forearm across to the notebook -->
<g filter="url(#cutS)">
  <path fill="url(#orangeSleeve)" d="M57,59 C65,56 73,61 73.5,71 C74,80 72.5,88 70.5,93.5 C68.5,97.5 63.5,98 60,95.5 L46,91.5 L46,83 L60,85.5 C60.5,77 59.5,67 57,59 Z"/>
</g>
<path d="M62,64 C64.5,72 65.5,80 65,88" stroke="#f0a24c" stroke-width=".8" fill="none" opacity=".55"/>
<g filter="url(#cutS)">
  <path fill="url(#rib)" d="M40.5,82 L46.5,83 L46.5,92.5 L40.5,91.5 Z"/>
  <path fill="#7a3222" d="M31.5,80.5 C34.5,79 38.5,80 40.5,82.5 L40.5,92 C37.5,93.5 33.5,92.5 31,90.5 Z"/>
</g>
<path d="M33,84 C35,83.4 37,83.6 38.5,84.6" stroke="#a9563f" stroke-width=".7" fill="none" opacity=".7"/>

<!-- the head, a little larger than life -->
<g transform="translate(57 55) scale(.95) translate(-57 -55)">
  <path fill="#b09070" d="M52,45 L62,43.5 L63.5,56 L52.5,57 Z"/>
  <!-- the tall stand collar: orange outside, rust in its shadow, the zip running up it -->
  <g filter="url(#cutS)">
    <path fill="#d9862a" d="M47.5,47.5 L63,44.8 L68.2,58.6 L48.4,61.2 Z"/>
    <path fill="#8e4216" d="M58.8,45.6 L63,44.8 L67.4,56.6 L62,57.6 Z"/>
  </g>
  <path d="M48.2,48.4 L48.9,60.6" stroke="#d9d6cc" stroke-width=".8" fill="none"/>
  <!-- the face: olive, warm in the shadows; cold light on the brow -->
  <g filter="url(#cutS)">
    <path fill="#b99a74" d="M66,19 C60,15 50,15.5 45,19.5 C43,22.5 42.5,25.5 42.5,27.5 L42,30 C41,32 39.5,35 38.2,37.8 C37.8,38.8 38.3,39.8 39.6,40.2 C40.6,40.6 41.4,41.2 41.4,42.2 L41.8,43.8 C41.4,44.8 41.5,45.8 42,46.8 C42.5,48.8 43.2,50.6 45.2,51.6 C48.2,53 54,52.6 58,50.6 C62,48.6 66,43.6 67,37.6 C68,29.6 68,23.6 66,19 Z"/>
  </g>
  <path fill="#a4643c" d="M56.4,36.6 C59,39 60.4,42.6 60.6,46.4 C58.6,49 55.4,50.8 51.8,51.8 C49.4,52.4 47,52.4 45,51.8 C49.6,50.4 53.4,47.4 55,43 C55.8,41 56.2,38.8 56.4,36.6 Z" opacity=".7"/>
  <path fill="#9fb1c4" d="M44.6,23.6 C47.4,21.4 51.6,20.8 55,22 C53.2,24.2 49.8,25.6 46,25.4 C45.4,24.9 44.9,24.3 44.6,23.6 Z" opacity=".85"/>
  <path d="M43.2,49.4 C45.4,51.2 48.8,51.6 51.8,50.8" stroke="#8e6a4a" stroke-width=".7" fill="none" opacity=".7"/>
  <path d="M41.8,41.8 L46,41.4" stroke="#2a1d17" stroke-width=".9" stroke-linecap="round"/>
  <path d="M44,27.6 C45.6,26.6 47.6,26.5 49.2,27" stroke="#1a1512" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- the ear: big, warm -->
  <path fill="#b8663f" d="M57.8,29.6 C61.4,28.8 64,31.8 63.6,35.8 C63.2,39.4 60.8,40.8 58.2,39.6 Z"/>
  <path d="M59.2,32.2 C60.8,32.8 61.4,34.6 60.4,36.4" stroke="#7e3e22" stroke-width=".7" fill="none"/>
  <!-- the shaved side, then the black crop standing up in spikes -->
  <path fill="#6a5a50" d="M58,25.6 C62.6,24 67.6,24.4 69.8,28 C71,32.6 70.4,38.2 68.4,43.2 L65,43.6 C65.4,38.6 64.6,34 62.4,31 C60.8,29.6 59.2,27.8 58,25.6 Z" opacity=".75"/>
  <g filter="url(#cutS)">
    <path fill="#16171a" d="M44,23.2 C43.2,20.4 43.8,17.8 45.6,16 L44.6,12.4 L47.8,14.2 L48.4,10 L51.2,12.6 L53,8.4 L55.2,11.8 L58.2,8.2 L59.4,12 L63.2,9.4 L63.6,13.2 L67.8,12.2 L67,15.4 C70.4,17.2 72.2,20 72.2,23.4 C72.2,25.8 71.2,27.6 69.6,28.4 C66,26.4 62,26.2 58.4,26.6 C55.8,27 54.2,28.8 53.4,31.4 L52.2,31.2 C52.2,28.6 51,26.2 48.8,24.8 C47.2,24 45.6,23.6 44,23.2 Z"/>
  </g>
  <path d="M48,18.8 C53,16 60,15.6 66.4,18.4" stroke="#56606a" stroke-width=".8" fill="none" opacity=".75" stroke-linecap="round"/>
  <!-- the glasses: a heavy round rim, the glint on the lens, the arm back to the ear -->
  <path d="M49.6,30.8 L59.6,31.6" stroke="#111" stroke-width="1.1"/>
  <circle cx="45.8" cy="31" r="3.7" fill="#dfe6e8" fill-opacity=".45" stroke="#111" stroke-width="1.5"/>
  <path d="M44,29.2 C45,28.4 46.4,28.4 47.2,29" stroke="#fff" stroke-width=".8" fill="none" opacity=".85"/>
  <path d="M42,31 L42.4,31" stroke="#111" stroke-width="1"/>
</g>
</svg>
