<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 10 72 193" width="72" height="193" data-soles="201" data-feet-x0="32" data-feet-x1="72">
<!-- Lieutenant Kim Kitsuragi, profile puppet facing left (docs/design.md §6.4): slim, upright,
     half a head shorter than Harry; black hair slicked back, small round black-rimmed glasses;
     orange bomber jacket with darker ribbed collar, cuffs and hem; brown-red leather driving
     gloves, a notebook in one hand and a pen in the other; brown trousers, dark brown boots.
     data-soles: the SVG y on the fold line; data-feet-x0/x1: the x range the stand tab covers. -->
<defs>
<filter id="cutS" x="-15%" y="-15%" width="135%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="tE"/>
  <feDisplacementMap in="SourceGraphic" in2="tE" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="tF"/>
  <feDiffuseLighting in="tF" surfaceScale="0.78" diffuseConstant="1" lighting-color="#fff" result="fib">
    <feDistantLight azimuth="235" elevation="58"/>
  </feDiffuseLighting>
  <feComposite in="fib" in2="shape" operator="arithmetic" k1="0.55" k2="0" k3="0.5" k4="0" result="tex"/>
  <feGaussianBlur in="shape" stdDeviation="2.4" result="sb"/>
  <feComposite in="shape" in2="sb" operator="out" result="rimM"/>
  <feFlood flood-color="#050508" flood-opacity="0.38"/>
  <feComposite in2="rimM" operator="in" result="burn"/>
  <feOffset in="shape" dx="0.4" dy="1.1" result="sOff"/>
  <feComposite in="shape" in2="sOff" operator="out" result="edgeM"/>
  <feFlood flood-color="#f1e5c8" flood-opacity="0.38"/>
  <feComposite in2="edgeM" operator="in" result="edge"/>
  <feGaussianBlur in="shape" stdDeviation="1.3" result="shB"/>
  <feOffset in="shB" dx="1" dy="1.8" result="shO"/>
  <feFlood flood-color="#060403" flood-opacity="0.55"/>
  <feComposite in2="shO" operator="in" result="drop"/>
  <feMerge><feMergeNode in="drop"/><feMergeNode in="tex"/><feMergeNode in="burn"/><feMergeNode in="edge"/></feMerge>
</filter>
<linearGradient id="bomber" x1="1" y1="0" x2="0" y2=".35">
  <stop offset="0" stop-color="#b8541f"/><stop offset=".55" stop-color="#d4692a"/><stop offset="1" stop-color="#e2803c"/>
</linearGradient>
<linearGradient id="bomberSleeve" x1="1" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#c85f24"/><stop offset="1" stop-color="#a94b1a"/>
</linearGradient>
<!-- ribbed knit: collar, cuffs and hem -->
<pattern id="rib" patternUnits="userSpaceOnUse" width="2.4" height="4">
  <rect width="2.4" height="4" fill="#7c3515"/>
  <rect width=".8" height="4" fill="#5e2710"/>
</pattern>
<linearGradient id="trousers" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#6a4a33"/><stop offset="1" stop-color="#533825"/>
</linearGradient>
</defs>

<!-- far leg, far boot -->
<g filter="url(#cutS)">
  <path fill="#4a3222" d="M57,126 L71,126 C71.5,148 71,170 70,191 L57.5,191 C57.5,170 57,148 57,126 Z"/>
</g>
<g filter="url(#cutS)">
  <path fill="#241a14" d="M56,189 L71,189 L71.5,201 L49,201 C49,196 51.5,190.5 56,189 Z"/>
</g>
<!-- near leg, near boot: toes pointing left -->
<g filter="url(#cutS)">
  <path fill="url(#trousers)" d="M45,126 L62,126 C62,150 61.5,171 61,191 L46.5,191 C46,170 45,148 45,126 Z"/>
</g>
<path d="M52,130 C52.5,152 53,172 53.5,190" stroke="#3e2a1c" stroke-width=".9" fill="none" opacity=".75"/>
<g filter="url(#cutS)">
  <path fill="#2e2119" d="M46,189 L62,189 L62.5,201 L33,201 C33,196 37,191 46,189 Z"/>
  <path fill="#160f0b" d="M33,199.4 H62.5 V201 H33 Z"/>
</g>
<path d="M37,195 C41,193 45,192 49,192" stroke="#6a5344" stroke-width=".8" fill="none" opacity=".6"/>

<!-- the bomber: straight back, a little blousy above the ribbed hem -->
<g filter="url(#cutS)">
  <path fill="url(#bomber)" d="M50,55 L67,55 C72,59 74.5,67 74.5,79 C74.5,92 75.5,104 75,116 L45,116 C43,104 41.5,92 41.5,80 C41.5,68 44.5,59 50,55 Z"/>
</g>
<g filter="url(#cutS)">
  <path fill="url(#rib)" d="M44.5,114 L75.5,114 L74.5,127.5 L45.5,127.5 Z"/>
</g>
<g fill="none" stroke-linecap="round">
  <path d="M43.5,62 C42.5,80 43,98 45,114" stroke="#8c3a14" stroke-width="1" opacity=".85"/>
  <path d="M47,64 C46,78 46.5,92 48,106" stroke="#f0a060" stroke-width=".8" opacity=".5"/>
  <path d="M69,66 C71,80 71.5,96 71,110" stroke="#9a4418" stroke-width=".9" opacity=".6"/>
</g>

<!-- the far hand: gloved, pen at work over the notebook -->
<g filter="url(#cutS)">
  <path fill="#a94b1a" d="M44,62 L51,63.5 L49,74 L40,72 Z"/>
  <path fill="url(#rib)" d="M37.5,63.5 L42.5,64 L41.5,73 L36.5,72.5 Z"/>
  <path fill="#6f2c1d" d="M30,64.5 C33,62.5 36.5,63 38,66 L38,72 C35.5,74 31.5,73.5 29.5,71.5 Z"/>
</g>
<path d="M22.5,78.5 L32,67.5" stroke="#151515" stroke-width="1.5" stroke-linecap="round"/>
<path d="M22.2,78.8 L23.6,77.4" stroke="#c9a05a" stroke-width="1.4" stroke-linecap="round"/>

<!-- the notebook, held in the near hand -->
<g filter="url(#cutS)">
  <path fill="#3a2a22" d="M19,70 L34.5,72 L33.5,93 L18,91 Z"/>
  <path fill="#efe8d8" d="M20.2,71.4 L33.4,73.2 L32.5,91.8 L19.3,90 Z"/>
</g>
<path d="M21.5,76.5 L31.5,78 M21.3,80.5 L31.3,82 M21.1,84.5 L28.5,85.6" stroke="#6f6a5d" stroke-width=".7" opacity=".8"/>

<!-- the near arm: bent at the elbow, the forearm across to the notebook -->
<g filter="url(#cutS)">
  <path fill="url(#bomberSleeve)" d="M57,59 C65,56 73,61 73.5,71 C74,80 72.5,88 70.5,93.5 C68.5,97.5 63.5,98 60,95.5 L46,91.5 L46,83 L60,85.5 C60.5,77 59.5,67 57,59 Z"/>
</g>
<path d="M62,64 C64.5,72 65.5,80 65,88" stroke="#e6874a" stroke-width=".8" fill="none" opacity=".5"/>
<g filter="url(#cutS)">
  <path fill="url(#rib)" d="M40.5,82 L46.5,83 L46.5,92.5 L40.5,91.5 Z"/>
  <path fill="#7a3222" d="M31.5,80.5 C34.5,79 38.5,80 40.5,82.5 L40.5,92 C37.5,93.5 33.5,92.5 31,90.5 Z"/>
</g>
<path d="M33,84 C35,83.4 37,83.6 38.5,84.6" stroke="#a9563f" stroke-width=".7" fill="none" opacity=".7"/>

<!-- the head, a little smaller than life: slicked-back hair, small round glasses -->
<g transform="translate(56 54) scale(.86) translate(-56 -54)">
  <path fill="#caa47c" d="M52,46 L62,44 L63.5,56 L52.5,57 Z"/>
  <!-- the ribbed stand collar -->
  <g filter="url(#cutS)">
    <path fill="url(#rib)" d="M49,51.5 L64.5,49.5 L67.5,58 L49.5,60.5 Z"/>
  </g>
  <g filter="url(#cutS)">
    <path fill="#d9b58d" d="M66,20 C60,16 50,16 45,20 C43,23 42.5,26 42.5,28 L42,30 C41,32 39.5,35 38,38 C37.5,39 38,40 39.5,40.5 C40.5,41 41.5,41.5 41.5,42.5 L42,44 C41.5,45 41.5,46 42,47 C42.5,49 43,51 45,52 C48,53.5 54,53 58,51 C62,49 66,44 67,38 C68,30 68,24 66,20 Z"/>
  </g>
  <path d="M43.2,49.6 C45.5,51.6 49,52 52,51.2" stroke="#a88460" stroke-width=".7" fill="none" opacity=".7"/>
  <path d="M44,28.4 C45.6,27.4 47.6,27.3 49.2,27.8" stroke="#1a1512" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- the ear -->
  <path fill="#c49c75" d="M58.5,31 C61.5,30.5 63.5,33 63,36.5 C62.5,39.5 60.5,40.5 58.5,39.5 Z"/>
  <path d="M59.6,33.4 C61,34 61.4,35.6 60.6,37.2" stroke="#8c6a4e" stroke-width=".7" fill="none"/>
  <!-- hair: black, short, combed straight back -->
  <g filter="url(#cutS)">
    <path fill="#17191c" d="M44.5,22.5 C44,16 51.5,11.5 60,12 C68.5,12.5 73.5,18 73.5,26.5 C73.5,33.5 71.5,39.5 68,44.5 L64.5,44 C65.5,38.5 65,31 62.5,27 C58.5,22.5 51.5,21 46.5,23.6 Z"/>
  </g>
  <path d="M47,17.6 C53,14.2 62,14 68.5,18.4 M47.8,20.8 C54,17.6 62.5,17.8 70,23 M52,23.4 C57,21.4 63,22.6 69.5,28 M66.5,31 C68.5,35 69,38.5 68.2,42" stroke="#5c6168" stroke-width=".8" fill="none" opacity=".75" stroke-linecap="round"/>
  <!-- glasses: a small round lens, its arm back to the ear -->
  <path d="M49.2,31 L59.5,31.6" stroke="#111" stroke-width=".9"/>
  <circle cx="45.6" cy="31.4" r="3.5" fill="#e2eaec" fill-opacity=".35" stroke="#111" stroke-width="1.1"/>
  <path d="M44.2,29.8 C45,29.2 46,29.2 46.6,29.6" stroke="#fff" stroke-width=".6" fill="none" opacity=".7"/>
  <path d="M42,31.2 L42.4,31.2" stroke="#111" stroke-width="1"/>
</g>
</svg>
