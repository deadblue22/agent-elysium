<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 5 104 220" width="104" height="220" data-soles="219" data-feet-x0="47" data-feet-x1="124" data-ember-x="105.4" data-ember-y="47.4">
<!-- Harry, version 3 (docs/cast.md): after the game's cover (The Final Cut; the same painting
     on the original release's poster). Big and broad in the chest rather than in the belly;
     dark hair hanging past the ears; a heavy horseshoe moustache running into thick
     muttonchops, the chin grey with stubble; a white shirt with a huge collar spread open at
     the neck; a rust-red tie pulled loose, its knot at the chest; a green blazer painted yellow-
     green in the light; dark olive trousers. The cover stops at the thigh: the trousers' flare
     and the shoes follow the game's outfit. Faces right.
     data-soles: the SVG y on the fold line; data-feet-x0/x1: the x range the stand tab covers;
     data-ember-x/y: the cigarette's tip (the scene puts a glow there). -->
<defs>
<filter id="cutS" x="-15%" y="-15%" width="135%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="tE"/>
  <feDisplacementMap in="SourceGraphic" in2="tE" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="tF"/>
  <feDiffuseLighting in="tF" surfaceScale="0.78" diffuseConstant="1" lighting-color="#fff" result="fib">
    <feDistantLight azimuth="235" elevation="58"/>
  </feDiffuseLighting>
  <feComposite in="fib" in2="shape" operator="arithmetic" k1="0.55" k2="0" k3="0.5" k4="0" result="tex"/>
  <feGaussianBlur in="shape" stdDeviation="2.4" result="sb"/>
  <feComposite in="shape" in2="sb" operator="out" result="rimM"/>
  <feFlood flood-color="#050508" flood-opacity="0.38"/>
  <feComposite in2="rimM" operator="in" result="burn"/>
  <feOffset in="shape" dx="0.4" dy="1.1" result="sOff"/>
  <feComposite in="shape" in2="sOff" operator="out" result="edgeM"/>
  <feFlood flood-color="#f1e5c8" flood-opacity="0.38"/>
  <feComposite in2="edgeM" operator="in" result="edge"/>
  <feGaussianBlur in="shape" stdDeviation="1.3" result="shB"/>
  <feOffset in="shB" dx="1" dy="1.8" result="shO"/>
  <feFlood flood-color="#060403" flood-opacity="0.55"/>
  <feComposite in2="shO" operator="in" result="drop"/>
  <feMerge><feMergeNode in="drop"/><feMergeNode in="tex"/><feMergeNode in="burn"/><feMergeNode in="edge"/></feMerge>
</filter>
<!-- the cover's green: olive in the body, yellow-green where the light falls, deep in the folds -->
<linearGradient id="green" x1="0" y1="0" x2="1" y2=".5">
  <stop offset="0" stop-color="#3e5a36"/><stop offset=".5" stop-color="#58703c"/><stop offset="1" stop-color="#7d8e44"/>
</linearGradient>
<linearGradient id="greenSleeve" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#6f8440"/><stop offset=".55" stop-color="#546a3a"/><stop offset="1" stop-color="#3a5334"/>
</linearGradient>
<linearGradient id="olive" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#55502f"/><stop offset=".6" stop-color="#5f5a36"/><stop offset="1" stop-color="#4b472a"/>
</linearGradient>
<linearGradient id="shirt" x1="0" y1="0" x2="1" y2=".4">
  <stop offset="0" stop-color="#cfd6d4"/><stop offset=".55" stop-color="#eef1ec"/><stop offset="1" stop-color="#d5dad6"/>
</linearGradient>
<linearGradient id="tie" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#b54a2c"/><stop offset=".6" stop-color="#a23d25"/><stop offset="1" stop-color="#86301e"/>
</linearGradient>
</defs>

