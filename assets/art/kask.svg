<svg viewBox="0 0 110 190" xmlns="http://www.w3.org/2000/svg" width="110" height="190">
<!-- Lieutenant Elena Kask, profile puppet. Soles at y=186.5. -->
<defs>
<filter id="cutS" x="-15%" y="-15%" width="135%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="tE"/>
      <feDisplacementMap in="SourceGraphic" in2="tE" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="tF"/>
      <feDiffuseLighting in="tF" surfaceScale="1.3" diffuseConstant="1" lighting-color="#fff" result="fib">
        <feDistantLight azimuth="235" elevation="58"/>
      </feDiffuseLighting>
      <feComposite in="fib" in2="shape" operator="arithmetic" k1="0.55" k2="0" k3="0.5" k4="0" result="tex"/>
      <feGaussianBlur in="shape" stdDeviation="2.4" result="sb"/>
      <feComposite in="shape" in2="sb" operator="out" result="rimM"/>
      <feFlood flood-color="#050508" flood-opacity="0.38"/>
      <feComposite in2="rimM" operator="in" result="burn"/>
      <feOffset in="shape" dx="0.4" dy="1.1" result="sOff"/>
      <feComposite in="shape" in2="sOff" operator="out" result="edgeM"/>
      <feFlood flood-color="#f1e5c8" flood-opacity="0.38"/>
      <feComposite in2="edgeM" operator="in" result="edge"/>
      <feGaussianBlur in="shape" stdDeviation="1.3" result="shB"/>
      <feOffset in="shB" dx="1" dy="1.8" result="shO"/>
      <feFlood flood-color="#060403" flood-opacity="0.55"/>
      <feComposite in2="shO" operator="in" result="drop"/>
      <feMerge>
<feMergeNode in="drop"/>
<feMergeNode in="tex"/>
<feMergeNode in="burn"/>
<feMergeNode in="edge"/>
</feMerge>
    </filter>
</defs>
          <defs>
            <linearGradient id="kCoat" x1="0" y1="0" x2="1" y2=".25">
              <stop offset="0" stop-color="#8a9c8e"/>
<stop offset=".55" stop-color="#74867a"/>
<stop offset="1" stop-color="#5b6b61"/>
            </linearGradient>
          </defs>
          <g id="kaskArt">
            <!-- legs together, boots pointing left -->
            <g filter="url(#cutS)">
              <path fill="#303a35" d="M57,146 L57,178 L65,178 L65,146 Z"/>
              <path fill="#353f3a" d="M47,146 L47,178 L55,178 L55,146 Z"/>
              <path fill="#1d1c1b" d="M49,186 Q49,178 55,177 L66,177 L66,186 Z"/>
              <path fill="#1a1918" d="M38,186 Q38,178 45,177 L56,177 L56,186 Z"/>
            </g>
            <path d="M41,180 q5,-2.4 11,-1.6" stroke="#8c8a86" stroke-width=".8" opacity=".5" fill="none"/>
            <!-- greatcoat: straight back, precise front -->
            <g filter="url(#cutS)">
<path fill="url(#kCoat)" d="M51,47 L67,47 C71,51 73,57 72.5,67 L71.5,87 L73.5,91 C74.5,109 76.5,127 77.5,146 L39.5,146 C40.5,127 42.5,109 44.5,93 L45.5,89 C43.5,77 41.5,63 43.5,55 C45.5,50 48,48 51,47 Z"/>
</g>
            <path d="M66,95 L68,146" stroke="#56675c" stroke-width="1" fill="none"/>
            <path d="M45.5,58 L46,88 M44.5,96 L41,146" stroke="#3f4c44" stroke-width="1.1" fill="none"/>
            <g fill="#c9a05a" stroke="#5e4a26" stroke-width=".5">
              <circle cx="48.5" cy="60" r="1.8"/>
<circle cx="48.5" cy="70" r="1.8"/>
<circle cx="48.5" cy="80" r="1.8"/>
<circle cx="46.6" cy="104" r="1.8"/>
<circle cx="45.4" cy="116" r="1.8"/>
            </g>
            <g filter="url(#cutS)">
              <path fill="#46534a" d="M44.5,87 L73.5,87 L73.5,94 L44.5,94 Z"/>
              <path fill="#65786c" d="M56,103 L69,103 L69,108 L56,108 Z"/>
              <path fill="#5b6c61" d="M55,48 L69,50 L69.5,54.5 L55.5,52.5 Z"/>
            </g>
            <rect x="44.6" y="87.6" width="6.4" height="5.8" fill="none" stroke="#c9a05a" stroke-width="1.3"/>
            <!-- arm crooked, notebook held out in front, pen at work -->
            <g filter="url(#cutS)">
<path fill="#6d8073" d="M57,51 C66,55 68,65 67,77 C66,83 60,85 52,81 L37,75 L39,69 L53,73 C57,71 57,63 55,55 Z"/>
</g>
            <path d="M58,70 q4,2 7,0" stroke="#3f4c44" stroke-width=".9" fill="none" opacity=".7"/>
            <g filter="url(#cutS)">
<path fill="#ede7d8" d="M22,60 L38,62 L37,82 L21,80 Z"/>
</g>
            <path d="M24.5,66 l10,1.3 M24.3,70 l10,1.3 M24.1,74 l7,.9" stroke="#6f6a5d" stroke-width=".7" opacity=".75"/>
            <path d="M35.6,61.7 L34.6,81.6" stroke="#2b2622" stroke-width="1.3"/>
            <ellipse cx="38.5" cy="72.5" rx="3.6" ry="3" fill="#cdb898"/>
            <path d="M40,69 L29,63.5" stroke="#1f1b18" stroke-width="1.4" stroke-linecap="round"/>
            <!-- collar, neck, head in profile facing left -->
            <g filter="url(#cutS)">
<path fill="#6a7c70" d="M49.5,43 L65,43 L66,51 L48.5,51 Z"/>
</g>
            <rect x="51" y="46" width="4" height="2.6" fill="#c9a05a"/>
            <rect x="53" y="38" width="9" height="7" fill="#b39e7f"/>
            <g filter="url(#cutS)">
              <path fill="#d3bf9f" d="M50,13 C58,11 66,15 67,23 L67,35 C64,41 58,43 52,42 L48.5,39.5 C47.2,37.6 47,36 46,34.8 L45.6,33.2 C44.6,32.6 43.6,32 41.8,30.6 L46,29.2 C45.8,26 46.6,22 47.4,19.4 C48,16 48.6,14.2 50,13 Z"/>
              <path fill="#26211d" d="M48,14.5 C52,7.5 62,6.5 68,10.5 C73,14.5 74,23.5 72,31.5 L68,35.5 C68,27.5 66,19.5 60,17.5 C55,16.5 50,17.5 48,19.5 Z"/>
              <circle cx="74" cy="23.5" r="5.5" fill="#26211d"/>
            </g>
            <path d="M63,25 c2,-1 3.6,.4 3,2.6 c-.4,1.6 -2.2,1.8 -3,.8 z" fill="#b39e7f"/>
            <!-- one round lens in profile, and its arm back to the ear -->
            <circle cx="49.6" cy="24.2" r="3.7" fill="#e2eaec" fill-opacity=".3" stroke="#1f1b18" stroke-width="1.1"/>
            <path d="M53.3,24 L63.5,23.2" stroke="#1f1b18" stroke-width=".9"/>
            <path d="M46.2,31 q1.4,.6 2.6,.2" stroke="#8a7458" stroke-width=".7" fill="none"/>
          </g>
        </svg>
