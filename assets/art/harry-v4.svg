<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 5 104 220" width="104" height="220" data-soles="219" data-feet-x0="47" data-feet-x1="123" data-ember-x="104.6" data-ember-y="46.4">
<!-- Harry, version 4 (docs/cast.md): after the concept art sheet ("kinda flabby chest but strong
     arms", "long thin legs & bulky torso"). The profile of the sheet's first figure: a round
     belly carried high, a heavy chest, thick arms, long thin legs; wavy dark hair to the
     shoulders, a big moustache with muttonchops. The dressed figure's colours: a bright green
     blazer with a grey patch on the upper sleeve, a mustard shirt whose huge collar stands up
     over the lapels, a dark belt, mustard flares (the sheet's separate drawing of them); dark
     shoes. A clenched fist. Faces right.
     data-soles: the SVG y on the fold line; data-feet-x0/x1: the x range the stand tab covers;
     data-ember-x/y: the cigarette's tip (the scene puts a glow there). -->
<defs>
<filter id="cutS" x="-15%" y="-15%" width="135%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="tE"/>
  <feDisplacementMap in="SourceGraphic" in2="tE" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="tF"/>
  <feDiffuseLighting in="tF" surfaceScale="0.78" diffuseConstant="1" lighting-color="#fff" result="fib">
    <feDistantLight azimuth="235" elevation="58"/>
  </feDiffuseLighting>
  <feComposite in="fib" in2="shape" operator="arithmetic" k1="0.55" k2="0" k3="0.5" k4="0" result="tex"/>
  <feGaussianBlur in="shape" stdDeviation="2.4" result="sb"/>
  <feComposite in="shape" in2="sb" operator="out" result="rimM"/>
  <feFlood flood-color="#050508" flood-opacity="0.38"/>
  <feComposite in2="rimM" operator="in" result="burn"/>
  <feOffset in="shape" dx="0.4" dy="1.1" result="sOff"/>
  <feComposite in="shape" in2="sOff" operator="out" result="edgeM"/>
  <feFlood flood-color="#f1e5c8" flood-opacity="0.38"/>
  <feComposite in2="edgeM" operator="in" result="edge"/>
  <feGaussianBlur in="shape" stdDeviation="1.3" result="shB"/>
  <feOffset in="shB" dx="1" dy="1.8" result="shO"/>
  <feFlood flood-color="#060403" flood-opacity="0.55"/>
  <feComposite in2="shO" operator="in" result="drop"/>
  <feMerge><feMergeNode in="drop"/><feMergeNode in="tex"/><feMergeNode in="burn"/><feMergeNode in="edge"/></feMerge>
</filter>
<!-- the sheet's green: bright, flat, a little blue in the shade -->
<linearGradient id="green" x1="0" y1="0" x2="1" y2=".35">
  <stop offset="0" stop-color="#236b37"/><stop offset=".55" stop-color="#2f8440"/><stop offset="1" stop-color="#3d9748"/>
</linearGradient>
<linearGradient id="greenSleeve" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#379146"/><stop offset="1" stop-color="#1f6232"/>
</linearGradient>
<linearGradient id="mustard" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#c89224"/><stop offset=".55" stop-color="#dba52e"/><stop offset="1" stop-color="#c28a22"/>
</linearGradient>
<linearGradient id="shirt" x1="0" y1="0" x2="1" y2=".4">
  <stop offset="0" stop-color="#c77d1e"/><stop offset=".6" stop-color="#dd952c"/><stop offset="1" stop-color="#c67c1f"/>
</linearGradient>
<!-- the sleeve patch: grey, ruled -->
<pattern id="patch" patternUnits="userSpaceOnUse" width="2" height="1.6">
  <rect width="2" height="1.6" fill="#b7bcb8"/>
  <rect width="2" height=".5" fill="#8a918e"/>
</pattern>
</defs>

<!-- far leg: long and thin, mustard in shade; its shoe -->
