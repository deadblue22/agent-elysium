<svg viewBox="670 0 670 600" xmlns="http://www.w3.org/2000/svg" width="670" height="600">
<!-- The right page's paper: fibre, mottling, foxing, toned edges, the faint printed rug and the puppets' stand tabs. Text is painted at runtime. -->
<defs>
<filter id="tide" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="8" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="22" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation=".6"/>
    </filter>
<filter id="soft4" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="4"/>
</filter>
<filter id="pageMottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="4" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .42  0 0 0 0 .30  0 0 0 0 .17  -1.6 0 0 0 1.05"/>
    </filter>
<filter id="pageTex" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="44" result="tF"/>
      <feDiffuseLighting in="tF" surfaceScale="1.5" diffuseConstant="1.05" lighting-color="#fff">
        <feDistantLight azimuth="240" elevation="60"/>
      </feDiffuseLighting>
    </filter>
<filter id="soft10" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="10"/>
</filter>
</defs>
            <defs>
              <!-- keep the paper texture quiet under the text column (≈23% strength there) -->
              <mask id="quietCol" maskUnits="userSpaceOnUse" x="0" y="0" width="1340" height="600">
                <rect width="1340" height="600" fill="#fff"/>
                <rect x="30" y="124" width="612" height="476" fill="#3a3a3a" filter="url(#soft10)"/>
              </mask>
            <radialGradient id="paperL" gradientUnits="userSpaceOnUse" cx="295" cy="312" r="482" gradientTransform="translate(295 312) scale(1 0.97) translate(-295 -312)">
<stop offset="0" stop-color="#e8ddc6"/>
<stop offset=".55" stop-color="#ded1b5"/>
<stop offset=".9" stop-color="#c8b797"/>
<stop offset="1" stop-color="#b5a383"/>
</radialGradient>
<radialGradient id="paperR" gradientUnits="userSpaceOnUse" cx="1018" cy="276" r="482" gradientTransform="translate(1018 276) scale(1 0.97) translate(-1018 -276)">
<stop offset="0" stop-color="#e6dbc3"/>
<stop offset=".5" stop-color="#dccfb2"/>
<stop offset=".88" stop-color="#c8b797"/>
<stop offset="1" stop-color="#b3a180"/>
</radialGradient>
</defs>
<g>
<rect x="0" y="0" width="670" height="600" fill="url(#paperL)"/>
<rect x="670" y="0" width="670" height="600" fill="url(#paperR)"/>
</g>
            <g mask="url(#quietCol)" style="mix-blend-mode:multiply">
<rect width="1340" height="600" filter="url(#pageTex)" opacity=".2"/>
</g>
            <g mask="url(#quietCol)" style="mix-blend-mode:multiply">
<rect width="1340" height="600" filter="url(#pageMottle)" opacity=".62"/>
</g>
            <!-- foxing -->
            <g mask="url(#quietCol)" style="mix-blend-mode:multiply">
<g fill="#8a5a2a" id="foxing">
<circle cx="919" cy="238" r="2.8" opacity="0.09"/>
