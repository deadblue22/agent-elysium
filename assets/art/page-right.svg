            <!-- puppet shadows: short contact shadow, long faint cast toward the lower left -->
            
            
            
            
            <!-- stand tabs: the fold that glues each puppet to the page -->
            <path d="M855,320 L905,320 L902,326 L858,326 Z M1045,306 L1091,306 L1088,312 L1048,312 Z" fill="#c9b898" opacity=".6"/>
            <path d="M855,320.4 H905 M1045,306.4 H1091" stroke="#2e2116" stroke-width="1.4" opacity=".8"/>
            <path d="M858,326 H902 M1048,312 H1088" stroke="#6b5a44" stroke-width=".8" opacity=".4"/>
