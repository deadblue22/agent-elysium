<circle cx="1139" cy="528" r="2.6" opacity="0.07"/>
<circle cx="1302" cy="368" r="2.7" opacity="0.08"/>
<circle cx="466" cy="242" r="0.7" opacity="0.08"/>
<circle cx="1218" cy="222" r="1.5" opacity="0.15"/>
<circle cx="906" cy="389" r="0.7" opacity="0.07"/>
