<circle cx="120" cy="470" r="36" fill="none" stroke="#7a4a1e" stroke-width="2.5" opacity="0.07"/>
</g>
</g>
            <!-- toned, handled edges -->
            <rect x="1.5" y="1.5" width="1337" height="597" fill="none" stroke="#6b4a26" stroke-width="5" opacity=".16" filter="url(#soft4)"/>
            <circle cx="770" cy="540" r="44" fill="none" stroke="#6e4a22" stroke-width="3" opacity=".08" filter="url(#tide)"/>
            <circle cx="770" cy="540" r="41" fill="none" stroke="#6e4a22" stroke-width="1" opacity=".06"/>
            <!-- faint printed rug under the actors -->
            <g opacity=".2" fill="none" style="mix-blend-mode:multiply">
              <ellipse cx="972" cy="316" rx="150" ry="46" stroke="#5a2a1c" stroke-width="2.4"/>
              <ellipse cx="972" cy="316" rx="142" ry="42" stroke="#5a2a1c" stroke-width=".9"/>
              <ellipse cx="972" cy="316" rx="128" ry="36" stroke="#1f2a44" stroke-width="5" stroke-dasharray="2.5 7"/>
              <ellipse cx="972" cy="316" rx="112" ry="30" stroke="#5a2a1c" stroke-width=".9"/>
              <ellipse cx="972" cy="316" rx="46" ry="12" stroke="#1f2a44" stroke-width="1"/>
            </g>
