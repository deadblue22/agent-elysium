<svg viewBox="1066 28 312 306" xmlns="http://www.w3.org/2000/svg" width="312" height="306">
<!-- Layer 4 (foreground), right: stack of books, wastebasket, coat stand with umbrella, overcoat and hat. Hinge at y=330. -->
<defs>
<filter id="cutS" x="-15%" y="-15%" width="135%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="tE"/>
      <feDisplacementMap in="SourceGraphic" in2="tE" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="tF"/>
      <feDiffuseLighting in="tF" surfaceScale="1.3" diffuseConstant="1" lighting-color="#fff" result="fib">
        <feDistantLight azimuth="235" elevation="58"/>
      </feDiffuseLighting>
      <feComposite in="fib" in2="shape" operator="arithmetic" k1="0.55" k2="0" k3="0.5" k4="0" result="tex"/>
      <feGaussianBlur in="shape" stdDeviation="2.4" result="sb"/>
      <feComposite in="shape" in2="sb" operator="out" result="rimM"/>
      <feFlood flood-color="#050508" flood-opacity="0.38"/>
      <feComposite in2="rimM" operator="in" result="burn"/>
      <feOffset in="shape" dx="0.4" dy="1.1" result="sOff"/>
      <feComposite in="shape" in2="sOff" operator="out" result="edgeM"/>
      <feFlood flood-color="#f1e5c8" flood-opacity="0.38"/>
      <feComposite in2="edgeM" operator="in" result="edge"/>
      <feGaussianBlur in="shape" stdDeviation="1.3" result="shB"/>
      <feOffset in="shB" dx="1" dy="1.8" result="shO"/>
      <feFlood flood-color="#060403" flood-opacity="0.55"/>
      <feComposite in2="shO" operator="in" result="drop"/>
      <feMerge>
<feMergeNode in="drop"/>
<feMergeNode in="tex"/>
<feMergeNode in="burn"/>
<feMergeNode in="edge"/>
</feMerge>
    </filter>
</defs>
          <defs>
            <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5a2c25"/>
<stop offset=".5" stop-color="#3e1f1b"/>
<stop offset="1" stop-color="#241210"/>
            </linearGradient>
          </defs>
          <g transform="translate(0 160)">
          
          
          
          
          <!-- floor stack of books -->
          <g filter="url(#cutS)">
            <path fill="#5b2f27" d="M1080,170 V156 H1152 V170 Z"/>
            <path fill="#3b4f4a" d="M1086,156 V144 H1150 V156 Z"/>
            <path fill="#7c6a45" d="M1082,144 V134 H1144 V144 Z"/>
            <path fill="#2c3347" d="M1090,134 V126 H1140 V134 Z"/>
          </g>
          <path d="M1080,163 H1152 M1086,150 H1150 M1082,139 H1144" stroke="#e6d9bb" stroke-width=".8" opacity=".25"/>
          <!-- wastebasket, one sheet crumpled beside it -->
          <g filter="url(#cutS)">
            <path fill="#5b4631" d="M1166,122 H1216 L1210,170 H1172 Z"/>
            <path fill="#cfc4ad" d="M1224,170 C1220,162 1226,154 1234,156 C1242,154 1246,164 1242,170 Z"/>
            <path fill="#d6ccb4" d="M1172,122 C1176,112 1190,110 1196,116 C1204,108 1214,114 1212,122 Z"/>
          </g>
          <g stroke="#2d2217" stroke-width="1" opacity=".7" fill="none" id="weave">
<path d="M1167.72,128 H1214.28"/>
<path d="M1168.56,135 H1213.44"/>
<path d="M1169.4,142 H1212.6"/>
<path d="M1170.24,149 H1211.76"/>
<path d="M1171.08,156 H1210.92"/>
<path d="M1171.92,163 H1210.08"/>
<path d="M1172,123 L1174.28,169"/>
<path d="M1180,123 L1181.32,169"/>
<path d="M1188,123 L1188.36,169"/>
<path d="M1196,123 L1195.4,169"/>
<path d="M1204,123 L1202.44,169"/>
<path d="M1212,123 L1209.48,169"/>
</g>
          </g>
          <!-- coat stand with the dead man's hat and overcoat: a tall piece that breaks the wall's edge -->
          <defs>
            <linearGradient id="oldCoat" x1="0" x2="1">
              <stop offset="0" stop-color="#3a2f26"/>
<stop offset=".6" stop-color="#2a221c"/>
<stop offset="1" stop-color="#1a1512"/>
            </linearGradient>
          </defs>
          <g filter="url(#cutS)">
            <path fill="#1c1510" d="M1320,318 L1321,44 L1327,44 L1328,318 L1348,330 L1340,330 L1324,322 L1308,330 L1300,330 Z"/>
            <circle cx="1324" cy="39" r="5" fill="#2a2018"/>
            <path fill="#1c1510" d="M1322,60 C1314,58 1306,60 1302,66 C1300,70 1302,73 1305,72 L1306,69 C1308,65 1314,64 1322,66 Z M1326,60 C1334,58 1342,60 1346,66 C1348,70 1346,73 1343,72 L1342,69 C1340,65 1334,64 1326,66 Z"/>
          </g>
          <!-- a furled umbrella leaning on the stand -->
          <g filter="url(#cutS)">
            <path fill="#16181c" d="M1330,328 L1333,328 L1346,246 L1342,246 Z"/>
            <path fill="#1d2126" d="M1341,250 C1340,262 1336,284 1333,306 L1337,306 C1342,286 1346,264 1348,252 Z"/>
            <path d="M1344,247 C1345,238 1352,236 1354,242" stroke="#5a4630" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          </g>
          <!-- the old man's overcoat hanging limp from one hook -->
          <g filter="url(#cutS)">
            <path fill="url(#oldCoat)" d="M1304,68 C1297,74 1292,88 1291,104 C1289,140 1291,190 1287,240 L1295,244 L1302,239 L1310,245 L1318,239 L1316,190 C1316,142 1315,100 1310,76 Z"/>
            <path fill="#211a15" d="M1296,90 C1292,120 1292,160 1294,196 L1300,196 C1299,160 1300,120 1302,96 Z"/>
          </g>
          <path d="M1305,70 L1303,120 L1307,170" stroke="#0d0a08" stroke-width="1.2" fill="none" opacity=".7"/>
          <path d="M1292,108 C1290,150 1291,196 1288,236" stroke="#8a7560" stroke-width=".9" fill="none" opacity=".35"/>
          <!-- his hat, tipped on the other hook -->
          <g filter="url(#cutS)" transform="rotate(16 1346 66)">
            <path fill="#231c17" d="M1334,66 C1333,56 1338,50 1347,50 C1356,50 1361,56 1360,66 Z"/>
            <path fill="#18130f" d="M1327,67 C1336,63 1358,63 1367,67 C1368,70 1364,71 1358,70 C1350,69 1344,69 1336,70 C1331,71 1326,70 1327,67 Z"/>
          </g>
        </svg>
