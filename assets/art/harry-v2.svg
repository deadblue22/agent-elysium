</g>

<!-- the blazer: olive drab, long, open over the shirt; a white patch high on the back -->
<g filter="url(#cutS)">
  <path fill="url(#olive)" d="M68,54 C60,55.5 54,59.5 51.5,66 C49.5,72 49.8,82 51,92 C52,100 52.2,106 51.8,113 C51.4,122 51,132 50.5,143 L78,145 L99.5,139.5 C98.5,127 96.8,114 95.2,101 C93.6,88 91,74 87,61 L80,56 Z"/>
</g>
<g filter="url(#cutS)">
  <path fill="#e2dfd2" d="M50.2,67.5 L58.5,66.2 L59.2,74.6 L50.6,76 C50,73 50,70 50.2,67.5 Z"/>
</g>
<!-- the lapel and the collar -->
<g filter="url(#cutS)">
  <path fill="#77824f" d="M83,58.5 L89.5,61 L94,77 L91.2,84 L86.5,70 Z"/>
  <path fill="#565f36" d="M64,55 L77,52 L79,58.5 L66,61 Z"/>
</g>
<g fill="none" stroke-linecap="round">
  <path d="M54.8,116 C54.6,125 54.5,134 54.4,143" stroke="#3b4124" stroke-width="1" opacity=".75"/>
  <path d="M53,98 C54,94 54.2,90 54,86" stroke="#8e9866" stroke-width=".7" opacity=".5"/>
  <path d="M80,118 L94,116.5" stroke="#3b4124" stroke-width="1.2" opacity=".75"/>
</g>

<!-- the near arm: a rounded shoulder, the sleeve hanging straight, the hand at the thigh -->
<g filter="url(#cutS)">
  <path fill="url(#oliveSleeve)" d="M59,63 C63,57.5 72,56.5 77,61 C80,65 79.5,74 78.5,84 C77.5,95 76.5,104 76.5,112 C77.5,119 79,126 80.5,131.5 L71.5,133.5 C69,126 67,118 65.5,110 C63.5,99 61.5,88 59.5,78 C58.5,72 58,67 59,63 Z"/>
</g>
<g fill="none" stroke-linecap="round">
  <path d="M61.5,66 C65,61.5 71,60.5 75.5,63" stroke="#9aa472" stroke-width=".9" opacity=".6"/>
  <path d="M62.5,78 C64,89 66,100 68.5,111" stroke="#3f4526" stroke-width=".8" opacity=".6"/>
</g>
<g filter="url(#cutS)">
  <path fill="#ecebe2" d="M70.2,67.2 L76.4,66.6 L76.8,72.2 L70.6,72.8 Z"/>
</g>
<g filter="url(#cutS)">
  <path fill="#d9d5c9" d="M71,131.5 L80.4,129.4 L81.2,133 L72,135 Z"/>
  <path fill="#c8977a" d="M72.6,134.4 C75.4,133 79.2,132.8 81,134.8 C82.2,137.6 81.6,141.4 79.4,143.6 C76.8,144.4 73.8,143.2 72.8,140.2 Z"/>
</g>

<!-- the head: long straight hair to the collar, the moustache and its muttonchops -->
<!-- neck and shirt collar -->
<path fill="#c08f70" d="M69,44 L84,45 L86.5,57 L69.5,59 Z"/>
<g filter="url(#cutS)">
  <path fill="#efeee6" d="M79,52.5 L90.5,55.5 L88.5,62.5 L81.5,59 Z"/>
</g>
<g filter="url(#cutS)">
  <path fill="#cf9f80" d="M66,18 C72,13.5 83,13.5 88,18.5 C90.5,21.5 91.2,25 91.4,28 L92,31 C93.8,33.5 96,36 97.6,38.4 C98.4,39.8 97.8,40.9 96.2,41.1 L94.2,41.4 C94.6,42.8 94.8,44 94.5,45.2 L94.2,47.2 C93.8,49.5 92.4,51.4 89.8,52.4 C86.5,53.5 82.5,53.4 78.5,52.4 C74,51 70,48.5 67.5,45 C64.5,40.5 63.5,33 63.8,26 C64,22.5 64.8,20 66,18 Z"/>
</g>
<!-- the eye, the brow, a flushed nose -->
<circle cx="95.2" cy="37.6" r="2.2" fill="#c1695a" opacity=".6"/>
<path d="M86.5,31.2 L89.4,31" stroke="#2a1a14" stroke-width="1.15" stroke-linecap="round"/>
<path d="M85.8,33.4 C87.2,34.6 89,34.7 90.2,33.8" stroke="#8a5646" stroke-width=".8" fill="none" stroke-linecap="round"/>
<path d="M84.8,28.4 C86.6,27.2 89.2,27 91.2,27.8" stroke="#4a3522" stroke-width="1.3" fill="none" stroke-linecap="round"/>
<!-- the muttonchop: a band down the cheek from under the hair to the jaw, into the moustache -->
<g filter="url(#cutS)">
  <path fill="#4a3524" d="M76,33 C78.5,36.5 80.5,40 83,43 C84.5,44.6 86,45.6 87.2,46.2 C85.6,48.4 82.6,49.4 79.6,48.8 C76.8,48.2 74.8,46.2 74.2,43.4 C73.6,40 74.4,36.2 76,33 Z"/>
</g>
<!-- the moustache, bushy, drooping past the corner of the mouth -->
<g filter="url(#cutS)">
  <path fill="#503a27" d="M86.5,44.6 C89,42.6 92,41.2 95.6,41.2 C97.2,42.2 97.4,44.4 96.4,46.6 C95.8,48.4 94.8,49.8 93.6,50.8 C92.8,49.2 91.4,48 89.4,47.8 C88,47.6 86.8,46.6 86.5,44.6 Z"/>
</g>
<!-- hair: back from the brow, over the ear, hanging straight down to the collar -->
<g filter="url(#cutS)">
  <path fill="url(#hair)" d="M90,23 C89,15.5 82.5,10.5 73.5,10.5 C64,10.5 57.5,16 56,24 C55,31 55.3,40 55.5,48 C55.6,54 56.5,59 58.3,63.5 L61.5,61.8 L64.2,64.6 L67,62 L70.2,64 C71.5,58.5 72.5,52 73.5,45.5 C74.5,39 75.8,32.5 77.8,27.8 C81.5,23.8 85.5,22.4 90,23 Z"/>
