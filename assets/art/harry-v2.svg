<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 5 104 220" width="104" height="220" data-soles="219" data-feet-x0="48" data-feet-x1="124" data-ember-x="104.6" data-ember-y="46.6">
<!-- Harry, version 2 (docs/cast.md): after the in-game 3D model (the Whirling-in-Rags screenshot on
     the Steam page). Tall, long in the leg, a moderate belly; long straight brown hair hanging
     to the collar; an olive-drab blazer, long, with a white patch high on the back and one on
     the upper sleeve; ochre flares; green shoes. The front, not seen in the screenshot: a white
     shirt and the Horrific Necktie as its item art has it (teal, printed with yellow, rust and
     white); the moustache and muttonchops of the portraits and the 3D sculpt. Faces right.
     data-soles: the SVG y on the fold line; data-feet-x0/x1: the x range the stand tab covers;
     data-ember-x/y: the cigarette's tip (the scene puts a glow there). -->
<defs>
<filter id="cutS" x="-15%" y="-15%" width="135%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="tE"/>
  <feDisplacementMap in="SourceGraphic" in2="tE" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="tF"/>
  <feDiffuseLighting in="tF" surfaceScale="0.78" diffuseConstant="1" lighting-color="#fff" result="fib">
    <feDistantLight azimuth="235" elevation="58"/>
  </feDiffuseLighting>
  <feComposite in="fib" in2="shape" operator="arithmetic" k1="0.55" k2="0" k3="0.5" k4="0" result="tex"/>
  <feGaussianBlur in="shape" stdDeviation="2.4" result="sb"/>
  <feComposite in="shape" in2="sb" operator="out" result="rimM"/>
  <feFlood flood-color="#050508" flood-opacity="0.38"/>
  <feComposite in2="rimM" operator="in" result="burn"/>
  <feOffset in="shape" dx="0.4" dy="1.1" result="sOff"/>
  <feComposite in="shape" in2="sOff" operator="out" result="edgeM"/>
  <feFlood flood-color="#f1e5c8" flood-opacity="0.38"/>
  <feComposite in2="edgeM" operator="in" result="edge"/>
  <feGaussianBlur in="shape" stdDeviation="1.3" result="shB"/>
  <feOffset in="shB" dx="1" dy="1.8" result="shO"/>
  <feFlood flood-color="#060403" flood-opacity="0.55"/>
  <feComposite in2="shO" operator="in" result="drop"/>
  <feMerge><feMergeNode in="drop"/><feMergeNode in="tex"/><feMergeNode in="burn"/><feMergeNode in="edge"/></feMerge>
</filter>
<!-- olive drab, lighter across the shoulders where the room light catches it -->
<linearGradient id="olive" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#7c8656"/><stop offset=".3" stop-color="#636c3f"/><stop offset="1" stop-color="#4a5130"/>
</linearGradient>
<linearGradient id="oliveSleeve" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#737d4d"/><stop offset=".6" stop-color="#5a6238"/><stop offset="1" stop-color="#485030"/>
</linearGradient>
<linearGradient id="ochre" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a8752f"/><stop offset=".55" stop-color="#bb8638"/><stop offset="1" stop-color="#a3702c"/>
</linearGradient>
<linearGradient id="shirt" x1="0" y1="0" x2="1" y2=".4">
  <stop offset="0" stop-color="#d6d4c8"/><stop offset=".6" stop-color="#eeede4"/><stop offset="1" stop-color="#d9d6ca"/>
</linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#6c5439"/><stop offset=".45" stop-color="#58432e"/><stop offset="1" stop-color="#463524"/>
</linearGradient>
<!-- the Horrific Necktie: a teal ground printed with yellow cogs, rust squares and pale stars -->
<pattern id="tie" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(-24)">
  <rect width="10" height="10" fill="#2e7163"/>
  <circle cx="2.6" cy="2.6" r="1.35" fill="#d8a531"/>
  <circle cx="2.6" cy="2.6" r=".45" fill="#2e7163"/>
  <rect x="6.2" y="5.6" width="1.9" height="1.9" fill="#b8472b"/>
  <path d="M1.6,7 l.6,1.2 l.6,-1.2 l-1.2,.45 h1.2 z" fill="#ece3c6"/>
  <circle cx="7.6" cy="1.6" r=".6" fill="#c98c86"/>
</pattern>
</defs>

<!-- far leg: an ochre flare in shade, and its green shoe -->
<g filter="url(#cutS)">
  <path fill="#8f6127" d="M58,130 L80,130 C80,150 78.5,168 76.5,182 C77,192 80,201 84,211 L52,211 C55,201 58,191 60,181 C59,164 58,147 58,130 Z"/>
</g>
<g filter="url(#cutS)">
  <path fill="#2c5a43" d="M54,209.5 L83,209.5 C88,209.5 92,211.5 93.5,214.5 L94,217.5 L52,217.5 C51.5,214 52.2,211 54,209.5 Z"/>
