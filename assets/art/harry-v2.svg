<g filter="url(#cutS)">
  <path fill="url(#tie)" d="M88.5,62 L93.5,61.2 C98,68 102,77 105,87 C107.5,95 108.5,103 108.2,111 L103.5,118 L99.5,111 C100,104 99.5,97 98,90.5 C95.5,81 92,72 88.5,65 Z"/>
