  <path d="M70.5,27 C69.5,35 69.4,44 69.2,53 M79,16.4 C83.5,16.4 87.2,18.8 89,22" stroke="#3a2b1d" stroke-width=".7" opacity=".7"/>
</g>

<!-- the cigarette, from the corner of the mouth -->
<path fill="#ece6d8" d="M93.4,45 L104.8,46 L104.7,47.4 L93.3,46.5 Z"/>
<path fill="#8b8378" d="M103.6,45.9 L104.8,46 L104.7,47.4 L103.5,47.3 Z"/>
</svg>
