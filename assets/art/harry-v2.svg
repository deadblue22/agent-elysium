  <path fill="#1a3a2b" d="M84,216.6 H125 V219 H84 Z"/>
  <path fill="#5c9474" d="M104,211 C109,210.6 115,211 119.5,212.5 C115,212.6 109.5,212.3 104,212.2 Z"/>
</g>

<!-- the shirt over a moderate belly, tucked in at the belt -->
<g filter="url(#cutS)">
  <path fill="url(#shirt)" d="M78,58 L90,59 C96,66 101,77 104,89 C106.5,99 106,110 102.5,118 C100,124 96,127.5 90,128.5 L76,129 Z"/>
</g>
<path d="M98,86 C101,92 102.5,98 102.5,104 M96,112 C99,114.5 100.5,117.5 101,120.5" stroke="#aaa79b" stroke-width=".8" fill="none" opacity=".8"/>
<path fill="#3a2a1d" d="M84,123 L101.5,121.2 L100.6,126 L84,128 Z"/>
<path fill="#c9b27a" d="M95.5,121.8 L99,121.4 L98.7,125.5 L95.2,125.9 Z"/>

