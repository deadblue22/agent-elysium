  <path d="M97,79 C102,84 105,90 106,96" stroke="#fffdf6" stroke-width=".7" opacity=".7"/>
</g>
<path fill="#3a2a1d" d="M88,121 L105,119.5 L104,124.5 L88,126.5 Z"/>

<!-- the Horrific Necktie: dark teal, a yellow hook, rust patches; swung over the belly -->
<g filter="url(#cutS)">
  <path fill="#244c45" d="M85.5,58.5 L91.5,57.5 C100,65 108.5,76 114.5,88 L119.5,98.5 C121,106 121.5,115 121,123 L116,131 L110,123.5 C110,115 110,107 109,100.5 C104,89 96.5,78 89.5,67.5 C88,65 86.5,63 85.5,62 Z"/>
