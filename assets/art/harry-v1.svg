  <g filter="url(#cutS)">
    <path fill="#3f3639" d="M88.6,23.6 C88,17 83,11.5 74,10.6 C64,9.8 56,14.5 53.4,22.5 C51.6,28.5 52.4,35 53.2,41 C53.8,46 55.4,50.6 58,54.4 L60.6,51.6 L62.6,55.2 L64.8,50.8 C64.2,45.6 64.2,40 64.8,34.6 C65.4,29.6 67.6,25.6 71,23.2 C75.8,20.4 82.4,20.6 88.6,23.6 Z"/>
