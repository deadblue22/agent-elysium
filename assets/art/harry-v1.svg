    <path fill="#d2ab94" d="M62,21 C68,15.5 80,14.5 86.5,19.5 C89.5,22 90.6,25.5 90.8,28.5 L91.4,31.2 C93.4,33.8 96,36.6 97.8,39.2 C98.6,40.6 98,41.8 96.4,42.1 L94.4,42.4 C94.8,43.8 94.9,45 94.6,46.4 L94.2,48.6 C93.8,51 92.4,52.8 89.8,53.8 C86.5,55 82.5,55 78.5,54 C74,52.6 69.8,50 67.2,46.4 C64,42 62.4,35 62.2,28.5 C62.1,25.5 62,23 62,21 Z"/>
  </g>
  <path fill="#9ca08c" d="M72,42 C75.5,45.5 80,48.5 85,50 C88,50.8 90.6,50.8 92.6,50.2 C92,52.6 90.6,54 88.4,54.6 C84.6,55.4 80.4,55 76.6,53.6 C72.8,52 70,49.4 68.4,46.2 Z" opacity=".85"/>
  <path fill="#c25c4f" d="M84,30.8 C86.4,29.6 89.6,29.8 91.6,31.6 L92.4,34.6 C90,36.4 86.6,36.6 84.2,35 Z" opacity=".75"/>
  <circle cx="95.4" cy="38.8" r="2.6" fill="#c65448" opacity=".7"/>
  <!-- the heavy lid and the bag under it -->
  <path d="M85.4,32.2 C86.8,31.2 88.8,31 90.4,31.6" stroke="#2a1a14" stroke-width="1.25" fill="none" stroke-linecap="round"/>
  <path d="M85.2,35 C86.8,36.3 88.8,36.4 90.4,35.4" stroke="#8a4a40" stroke-width=".85" fill="none" stroke-linecap="round"/>
  <path d="M83.8,28.4 C85.8,27 88.8,26.8 91,27.6" stroke="#3b2d2c" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- the ear: big and red -->
  <path fill="#b9594a" d="M64.6,31 C68.6,29.6 72.4,32 72.4,36.6 C72.4,40.6 69.8,43 65.8,42 C65,38.4 64.6,34.6 64.6,31 Z"/>
  <path d="M66.4,33.4 C69,34 69.8,36.4 68.8,39" stroke="#7e3a30" stroke-width=".75" fill="none"/>
  <!-- grey stubble on the chin -->
  <path fill="#a09d98" d="M86,48.5 C88.6,49 91.2,48.8 93.6,48 C93.6,50.6 92.4,52.6 90,53.6 C87.8,54.2 85.6,53.8 84.2,52.6 Z" opacity=".9"/>
  <!-- the muttonchop: from the temple in front of the ear, down over the cheek and the jaw,
       ragged at its edge, into the moustache -->
  <g filter="url(#cutS)">
    <path fill="#3a2a25" d="M72.4,27.6 L75.6,28.4 C76.2,32 77,35.4 78.6,38.4 L80.4,37.6 L80.2,40.6 C82,42.4 84.4,43.6 87,44.2 L86.6,47 L88.6,48.6 L86,49.8 C84.6,51.8 82.4,53.4 79.4,53.8 L78.8,55.6 L76.6,53.8 C74,53.2 71.8,51.6 70.6,49.2 L68.6,49.6 L69.6,46.8 C69,44.2 69.8,41.6 71.2,39.4 C71.4,35.4 71.6,31.4 72.4,27.6 Z"/>
  </g>
  <!-- the grin, the teeth under the moustache -->
  <path fill="#4a1e1c" d="M86.6,45.8 C89,45.2 91.6,45.2 94,45.8 C93.4,47.4 91.8,48.4 89.8,48.4 C88.4,48.4 87.2,47.4 86.6,45.8 Z"/>
  <path fill="#ebe3cf" d="M88,45.6 C90,45.2 92,45.2 93.6,45.7 L93.2,46.7 C91.6,46.4 89.8,46.4 88.4,46.8 Z"/>
  <!-- the moustache, bushy, over the grin and past it -->
  <g filter="url(#cutS)">
    <path fill="#3f2e28" d="M85.4,44.4 C87.6,42.6 91,41.8 95.4,42.2 C97.4,42.6 98,44 97.2,45.4 C96.2,46.8 94.4,47 92.6,46.2 C90.6,45.6 88.6,45.8 86.8,47.2 C86,46.8 85.4,45.8 85.4,44.4 Z"/>
