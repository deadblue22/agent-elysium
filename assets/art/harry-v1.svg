<g filter="url(#cutS)">
  <path fill="#5f8f4f" d="M41.5,76 C44,69.5 48.5,64.5 54.5,61.6 L55.6,63.6 C50.4,66.6 46.6,71 44.2,77 Z"/>
  <path fill="#5f8f4f" d="M77.6,96 L86.4,95 L86.8,97.2 L78,98.2 Z"/>
</g>
<g fill="none" stroke-linecap="round">
  <path d="M44,90 C47,104 49,118 51,132" stroke="#1b3a1d" stroke-width="1" opacity=".75"/>
  <path d="M74,112 L89,110.5" stroke="#1b3a1d" stroke-width="1.3" opacity=".8"/>
</g>

<!-- the near arm: hanging, heavy, the hand at the hip -->
<g filter="url(#cutS)">
  <path fill="url(#bottleSleeve)" d="M55,60 C65,57 72,63 72.5,72 C73,84 69,95 65,101 C69,109 75,115 79,120 L71,127 C62,119 55,111 50.5,103 C48,88 49.5,70 55,60 Z"/>
</g>
<path d="M53,70 C52,82 53,94 56,103" stroke="#6e9a55" stroke-width=".9" fill="none" opacity=".6"/>
<g filter="url(#cutS)">
  <path fill="#e6ebe6" d="M71,121 L79,116.5 L82,121 L74,126.5 Z"/>
  <path fill="#c99a82" d="M74,126 C77,122 81,120 84,121.5 C86,124 85,129 82,132 C79,133 75,131 74,126 Z"/>
</g>

<!-- the head, a little larger than life -->
<g transform="translate(76 56) scale(1.02) translate(-76 -56)">
  <!-- neck, and the blue-grey shade in the open collar -->
  <path fill="#b3897a" d="M66,45 L83,46 L86,57 L67,59 Z"/>
  <path fill="#5f7d93" d="M80.5,53 L87,54.6 L88,58.6 L81.6,57.8 Z" opacity=".8"/>
  <!-- the huge collar: a long point laid out over the lapel -->
  <g filter="url(#cutS)">
    <path fill="#eef0ea" d="M74.5,51.5 L87.5,53.8 C91,60 95,67 99.5,75.5 L94.6,77 C91,71.6 87,66.4 82.6,62 L76.6,59.4 Z"/>
  </g>
  <path d="M85,58.4 C88.4,63.4 92,69 95.6,75.4" stroke="#9fb0b8" stroke-width=".8" fill="none" opacity=".8"/>
  <!-- the face: pale, heavy; grey-green shade along the jaw; flushed round the eyes and nose -->
