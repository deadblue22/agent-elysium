</g>
<path d="M114.4,113.8 l.8,1.6 l.8,-1.6 l-1.6,.6 h1.6 z" fill="#e4dcc4"/>

<!-- the blazer: bottle green, open, the back rounded; lighter strokes where the light falls -->
<g filter="url(#cutS)">
  <path fill="url(#bottle)" d="M61,53 C49,57 39,67 37.5,81 C36.5,97 39,114 42,133 L70,135 L96,131 C95,113 93,93 90,73 L84,57 Z"/>
