<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雪落之前</title>
<meta name="description" content="《雪落之前》第一章 study.clock：纸艺立体书 + 极乐迪斯科式排版，Three.js 渲染。">
<link rel="icon" href="data:,">
<style>
  :root{
    --paper:#E8DCC4; --rust:#C2562B;
    --serif:"Elysium Serif SC","EB Garamond",serif;
    --sans:"Elysium Sans SC","Inter","Elysium Serif SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b0806;overflow:hidden}
  /* 16:9 letterboxed frame; --s = frame width / 1600 (set by main.ts) */
  #frame{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%);--s:1;overflow:hidden;background:#0b0806}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* chrome: title, the sound, music and language toggles, outside the book's world */
  .chrome{position:absolute;left:0;top:0;width:100%;height:calc(80px * var(--s));pointer-events:none}
  .title{position:absolute;left:calc(40px * var(--s));top:calc(11px * var(--s));font-family:var(--serif);color:rgba(232,220,196,.74);font-size:calc(15px * var(--s));letter-spacing:.14em;white-space:nowrap}
  .title .ch{margin-left:.9em;font-size:.866em;color:rgba(232,220,196,.5);letter-spacing:.3em}
  .title::after{content:"";position:absolute;left:0;top:calc(25px * var(--s));width:calc(56px * var(--s));height:1px;background:rgba(194,86,43,.7)}
  :lang(en) .title{font-family:"EB Garamond",serif;letter-spacing:.06em;font-size:calc(16px * var(--s))}
  :lang(en) .title .ch{letter-spacing:.14em}
  .tools{position:absolute;right:calc(36px * var(--s));top:calc(8px * var(--s));display:flex;gap:calc(8px * var(--s))}
  .tools button{pointer-events:auto;cursor:pointer;border:1px solid rgba(232,220,196,.2);background:none;color:rgba(232,220,196,.42)}
  .tools button:hover{border-color:rgba(232,220,196,.4)}
  .tools button:focus-visible{outline:1px solid rgba(194,86,43,.9);outline-offset:2px}
  .lang{font-family:var(--sans);font-weight:600;font-size:calc(12.5px * var(--s));letter-spacing:.2em;padding:calc(5px * var(--s)) calc(10px * var(--s)) calc(4px * var(--s));line-height:1.2}
  .lang .on{color:rgba(232,220,196,.9)}
  .lang .sep{margin:0 .4em;opacity:.6}
  /* the sound-effects and music toggles: a speaker, two beamed quavers; lit when on, dimmed and struck through when off */
  .music,.sfx{padding:0 calc(8px * var(--s));line-height:0}
  .music svg,.sfx svg{display:block;width:calc(15px * var(--s));height:calc(15px * var(--s))}
  .music[aria-pressed="true"],.sfx[aria-pressed="true"]{color:rgba(232,220,196,.9)}
  .music[aria-pressed="true"] .strike,.sfx[aria-pressed="true"] .strike{display:none}
  .music .strike .gap,.sfx .strike .gap{stroke:#0b0806;stroke-width:3.4}

  /* the flashback's time marker (stage cue flashback), centred over the book */
  .when{position:absolute;left:50%;top:calc(9px * var(--s));transform:translateX(-50%);font-family:var(--serif);font-size:calc(17px * var(--s));letter-spacing:.3em;
    color:rgba(206,219,232,.86);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .9s ease;text-shadow:0 0 calc(12px * var(--s)) rgba(0,0,0,.6)}
  .when::after{content:"";position:absolute;left:50%;top:calc(29px * var(--s));width:calc(40px * var(--s));height:1px;margin-left:calc(-20px * var(--s));background:rgba(194,86,43,.75)}
  .when.on{opacity:1}
  :lang(en) .when{font-family:"EB Garamond",serif;letter-spacing:.14em;font-size:calc(18px * var(--s))}

  /* an option's tooltip: a check's chance and modifiers, or why a greyed option waits */
  .tip{position:absolute;left:0;top:0;pointer-events:none;z-index:2;max-width:calc(300px * var(--s));padding:calc(8px * var(--s)) calc(11px * var(--s)) calc(9px * var(--s));
    background:rgba(242,236,222,.96);color:#1E1A16;border:1px solid rgba(30,26,22,.55);box-shadow:calc(2px * var(--s)) calc(3px * var(--s)) 0 rgba(0,0,0,.35);
    font-family:var(--sans);font-weight:600;font-size:calc(13px * var(--s));line-height:1.45;letter-spacing:.04em}
  .tip[hidden]{display:none}
  .tip .skill{font-size:.86em;color:#6E655C;letter-spacing:.1em}
  .tip .head{font-size:1.2em;color:#A74824}
  .tip.greyed .head{font-size:1em;color:#6E655C;font-weight:600}
  .tip .mod{color:#2F6A81}
  .tip .red{color:#A3232B;font-size:.9em}
  @media (prefers-reduced-motion: reduce){ .when{transition:none} }

  /* a hover tip on the stage: a small paper tag, the name set like a speaker in the log */
  .hot{position:absolute;left:0;top:0;pointer-events:none;z-index:2;max-width:calc(320px * max(var(--s), .8));padding:calc(7px * var(--s)) calc(11px * var(--s)) calc(8px * var(--s));
    background:rgba(240,232,214,.97);color:#1E1A16;border:1px solid rgba(30,26,22,.45);box-shadow:calc(2px * var(--s)) calc(3px * var(--s)) 0 rgba(0,0,0,.32)}
  .hot[hidden]{display:none}
  .hot .name{font-family:var(--sans);font-weight:600;font-size:max(12px, calc(12.5px * var(--s)));letter-spacing:.12em;color:#4F4943;margin-bottom:.25em}
  :lang(en) .hot .name{text-transform:uppercase;letter-spacing:.14em}
  .hot .line{font-family:var(--serif);font-size:max(16px, calc(16.5px * var(--s)));line-height:1.45}
  :lang(en) .hot .line{font-family:"EB Garamond","Elysium Serif SC",serif;font-size:max(16.5px, calc(17.5px * var(--s)))}

  /* ?style=1: the option tooltip as the original's check card: a dark card, a header in the
     skill's attribute colour (--attr) with a brushed lower edge, the tier, the chance set large,
     what kind of check it is, the modifiers, and the two rolls that always lose and always win */
  .tip.card{width:calc(236px * var(--s));max-width:none;padding:0 0 calc(10px * var(--s));background:#15120f;color:#e9e3d6;border:none;text-align:center;
    box-shadow:0 0 0 1px rgba(196,204,210,.28),calc(3px * var(--s)) calc(4px * var(--s)) 0 rgba(0,0,0,.45);font-family:var(--serif);font-weight:400;letter-spacing:0}
  .tip.card .c-head{background:var(--attr);color:#fff;font:500 calc(19px * var(--s))/1 "Barlow Condensed","Elysium Sans SC","Inter",sans-serif;letter-spacing:.05em;
    padding:calc(7px * var(--s)) calc(10px * var(--s)) calc(9px * var(--s));text-shadow:0 1px 0 rgba(0,0,0,.25);
    clip-path:polygon(0 0,100% 0,100% 78%,93% 100%,86% 84%,74% 96%,61% 82%,47% 100%,33% 86%,21% 97%,9% 83%,0 95%)}
  .tip.card .c-tier{margin-top:calc(8px * var(--s));color:#d9b54a;font-size:calc(17px * var(--s));font-weight:600;letter-spacing:.08em}
  :lang(en) .tip.card .c-tier{text-transform:uppercase;font-family:"EB Garamond",serif}
  .tip.card .c-chance{font-size:calc(34px * var(--s));line-height:1.05;color:#fbf8f0}
  :lang(en) .tip.card .c-chance{font-family:"EB Garamond",serif}
  .tip.card .c-locked{margin:calc(10px * var(--s)) calc(14px * var(--s)) 0;color:#b9b1a3;font-size:calc(14px * var(--s));line-height:1.45}
  .tip.card .c-rule{height:1px;margin:calc(8px * var(--s)) calc(18px * var(--s)) calc(6px * var(--s));background:rgba(233,227,214,.3)}
  .tip.card .c-kind{color:#a79f91;font-size:calc(13px * var(--s));line-height:1.45;padding:0 calc(12px * var(--s))}
  .tip.card .c-kind.red{color:#e0624a}
  .tip.card .c-mod{color:#9fc6d2;font-size:calc(13px * var(--s));line-height:1.45}
  .tip.card .c-dice{display:flex;justify-content:space-between;margin:calc(8px * var(--s)) calc(16px * var(--s)) 0}
  .tip.card .c-pair{display:grid;grid-template-columns:auto auto;gap:calc(3px * var(--s));justify-items:center}
  .tip.card .c-cap{grid-column:1 / 3;color:#8f877a;font:500 calc(10.5px * var(--s))/1.2 "Barlow Condensed","Elysium Sans SC",sans-serif;letter-spacing:.08em}
  .tip.card .die{width:calc(16px * var(--s));height:calc(16px * var(--s));border:1px solid #8f877a;border-radius:calc(3px * var(--s));position:relative}
  .tip.card .die.p1{background:radial-gradient(circle,#8f877a 0 calc(1.8px * var(--s)),transparent calc(2.2px * var(--s)))}
  .tip.card .die.p6{background:
    radial-gradient(circle at 30% 22%,#8f877a 0 calc(1.3px * var(--s)),transparent calc(1.7px * var(--s))),radial-gradient(circle at 70% 22%,#8f877a 0 calc(1.3px * var(--s)),transparent calc(1.7px * var(--s))),
    radial-gradient(circle at 30% 50%,#8f877a 0 calc(1.3px * var(--s)),transparent calc(1.7px * var(--s))),radial-gradient(circle at 70% 50%,#8f877a 0 calc(1.3px * var(--s)),transparent calc(1.7px * var(--s))),
    radial-gradient(circle at 30% 78%,#8f877a 0 calc(1.3px * var(--s)),transparent calc(1.7px * var(--s))),radial-gradient(circle at 70% 78%,#8f877a 0 calc(1.3px * var(--s)),transparent calc(1.7px * var(--s)))}
  /* ?style=1: hover tips as the original's captions: the sentence alone, light serif on a black
     strip with brushed ends; a tip with a count keeps its name in front, as in the log
     (「士气 3 / 4 – 失败会让它流失……」) */
  :root[data-style~="1"] .hot{max-width:calc(420px * max(var(--s), .8));padding:calc(5px * var(--s)) calc(16px * var(--s)) calc(6px * var(--s)) calc(18px * var(--s));
    background:rgba(11,10,9,.9);color:#ece5d7;border:none;box-shadow:none;
    clip-path:polygon(calc(9px * var(--s)) 0,calc(100% - 4px) calc(2px * var(--s)),100% 40%,calc(100% - 3px) 100%,calc(5px * var(--s)) calc(100% - 2px),0 64%,calc(4px * var(--s)) 32%)}
  :root[data-style~="1"] .hot .name{display:inline;margin:0;font-family:var(--serif);font-weight:600;letter-spacing:0;color:#fbf8f1;font-size:max(16px, calc(16.5px * var(--s)))}
  :root[data-style~="1"] .hot .name::after{content:" – ";font-weight:400;color:#ece5d7}
  :root[data-style~="1"] .hot .name:empty{display:none}
  :root[data-style~="1"] .hot .line{display:inline}
  :root[data-style~="1"]:lang(en) .hot .name{font-family:"EB Garamond","Elysium Serif SC",serif;letter-spacing:.03em}

  /* ?style=3: the title on the original's white plaque (its INVENTORY, THOUGHT CABINET: black
     condensed capitals on a white strip from the screen's edge, tilted a little; here its end
     is torn, as paper), and the flashback's time as its HUD clock (large condensed digits,
     the day small after them) */
  :root[data-style~="3"] .title{left:0;top:calc(13px * var(--s));padding:calc(6px * var(--s)) calc(28px * var(--s)) calc(5px * var(--s)) calc(40px * var(--s));transform:rotate(-.8deg);transform-origin:0 50%;
    background:#ebe8e1;color:#141210;font:500 calc(17px * var(--s))/1.1 "Barlow Condensed","Elysium Sans SC",sans-serif;letter-spacing:.1em;
    clip-path:polygon(0 0,calc(100% - 9px) 0,100% 24%,calc(100% - 6px) 47%,calc(100% - 1px) 71%,calc(100% - 8px) 100%,0 100%);
    filter:drop-shadow(0 calc(2px * var(--s)) calc(3px * var(--s)) rgba(0,0,0,.4))}
  :root[data-style~="3"] .title::after{display:none}
  :root[data-style~="3"] .title .ch{color:#6c665c;letter-spacing:.24em;font-size:.78em}
  :root[data-style~="3"]:lang(en) .title{text-transform:uppercase;font-family:"Barlow Condensed","Inter",sans-serif;font-size:calc(19.5px * var(--s));letter-spacing:.06em}
  :root[data-style~="3"]:lang(en) .title .ch{letter-spacing:.12em}
  :root[data-style~="3"] .when{top:calc(6px * var(--s));font:500 calc(34px * var(--s))/1 "Barlow Condensed","Inter",sans-serif;letter-spacing:.04em;color:rgba(238,234,226,.92)}
  :root[data-style~="3"] .when::after{display:none}
  :root[data-style~="3"] .when .day{margin-left:.5em;font:600 calc(13px * var(--s)) var(--sans);letter-spacing:.12em;color:rgba(238,234,226,.66)}

  /* the log mirrored for screen readers */
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .sr-only:focus-within{position:absolute;left:8px;bottom:8px;width:auto;height:auto;clip-path:none;white-space:normal;background:#0b0806;color:#e8dcc4;padding:8px;font:14px/1.5 var(--serif);max-width:480px}

  #nogl{position:absolute;inset:0;display:grid;place-items:center;color:rgba(232,220,196,.8);font:16px/1.7 var(--serif);text-align:center;padding:24px}
  #nogl[hidden]{display:none}
</style>
</head>
<body>
<div id="frame">
  <canvas id="gl" aria-hidden="true"></canvas>
  <header class="chrome">
    <div class="title"><span id="title">《雪落之前》</span><span class="ch" id="chapter">第一章</span></div>
    <div class="tools">
      <button class="sfx" id="sfx" type="button" aria-label="音效 / Sound effects" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false" fill="currentColor">
        <path d="M2 6h2.6L8.4 2.8v10.4L4.6 10H2z"/>
        <path d="M10.3 5.4a3.6 3.6 0 0 1 0 5.2M12.2 3.6a6.1 6.1 0 0 1 0 8.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <g class="strike" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path class="gap" d="M2.2 2.2l11.6 11.6"/><path d="M2.2 2.2l11.6 11.6"/></g>
      </svg></button>
      <button class="music" id="music" type="button" aria-label="音乐 / Music" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false" fill="currentColor">
        <ellipse cx="4.1" cy="12.2" rx="2.4" ry="1.75" transform="rotate(-20 4.1 12.2)"/><ellipse cx="11.5" cy="10.6" rx="2.4" ry="1.75" transform="rotate(-20 11.5 10.6)"/>
        <path d="M5.3 12V4.1l8.6-1.9v8.2h-1.3V5.1l-6 1.3V12z"/>
        <g class="strike" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path class="gap" d="M2.2 2.2l11.6 11.6"/><path d="M2.2 2.2l11.6 11.6"/></g>
      </svg></button>
      <button class="lang" id="lang" type="button" aria-label="切换语言 / Switch language"><span data-lang="zh" class="on">中</span><span class="sep">/</span><span data-lang="en">EN</span></button>
    </div>
  </header>
  <div class="when" id="when" aria-hidden="true">昨晚 22:30</div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="hot" id="hot" role="tooltip" hidden><div class="name"></div><div class="line"></div></div>
  <section class="sr-only" aria-live="polite">
    <h2 id="log-heading">日志</h2>
    <ol id="log"></ol>
  </section>
  <div id="nogl" hidden><p>这个页面需要 WebGL 2。<br>This page needs WebGL 2.</p></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
